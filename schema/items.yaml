# Item schema for docs-as-code automotive ECU projects (Automotive SPICE 3.1).
#
# Defines which kinds of engineering items exist, which attributes and body
# sections they carry, how they link, and which coverage rules the trace check
# enforces. The trace engine, the write hooks and the gate checks all read this
# file; nothing about items is hard-coded elsewhere.
#
# Storage convention
#   - One item per Markdown file named <ID>.md: YAML front matter for attributes
#     and links, body sections (second-level headings) for text.
#   - A link is stored once, on the downstream item (the one that depends on the
#     other). The reverse direction is computed, so traceability is bidirectional
#     without duplicated data.
#   - Approval is evidence, not a typed-in word: `status: approved` only counts
#     while a final review record covers the item's current content hash.
#   - Progress is derived, not typed in: "implemented" and "verified" follow from
#     links, test runs and review records (see `derived`).
#   - Documents are generated views over items. What a reader needs as one
#     document (a requirements specification, an architecture description, a
#     detailed design) is assembled from items; it is not a second source.
#   - A design element inside an item is addressed as <ID>#<name>, for example a
#     function of a unit: UNT-0012#Debounce_Step.
#
# `supports` names the base practices and work products of the process catalog
# (aspice/3.1/) that an element of this schema provides evidence for, and the
# subclauses ("21434:9.4") and work products ("21434:WP-09-03") of ISO/SAE 21434
# (iso-sae-21434/2021/catalog.yaml), and the clauses (\"26262-6:7\") and work products
# (\"26262-6:7.5.2\") of ISO 26262 (iso-26262/2018/catalog.yaml).

schema_version: 2
aspice_version: "3.1"
id_format: "<PREFIX>-<NNNN>"       # prefix per type, zero-padded running number, never reused

# ---------------------------------------------------------------------------
# Lifecycles
# `stages` says from which states on an attribute or section marked
# before-review or before-approval must be present.
# ---------------------------------------------------------------------------
lifecycles:
  engineering:                     # requirements, architecture, design, test cases
    states: [draft, in-review, approved, rejected, obsolete]
    stages: {before-review: [in-review, approved, obsolete], before-approval: [approved, obsolete]}
    transitions:
      - {from: draft, to: in-review, when: "mandatory attributes, sections and upstream links for this stage are present"}
      - {from: in-review, to: approved, when: "a final review record with verdict approved covers the current content hash and has no open finding"}
      - {from: in-review, to: draft, when: "the review verdict is rework"}
      - {from: approved, to: draft, when: "the content changes; inside a baseline this needs an approved change request that affects the item"}
      - {from: [draft, in-review], to: rejected, when: "a rejection reason is recorded"}
      - {from: approved, to: obsolete, when: "a reason or a superseding item is recorded; inside a baseline this needs an approved change request"}
  change-request:
    states: [submitted, analysed, approved, rejected, implemented, verified, closed]
    stages: {before-review: [analysed, approved, implemented, verified, closed], before-approval: [approved, implemented, verified, closed]}
    transitions:
      - {from: submitted, to: analysed, when: "affected items are linked and the impact analysis section is filled"}
      - {from: analysed, to: approved, when: "the change control board decision is recorded"}
      - {from: analysed, to: rejected, when: "the decision and its reason are recorded"}
      - {from: approved, to: implemented, when: "every affected item is back in state approved or obsolete"}
      - {from: implemented, to: verified, when: "a review record confirms the implementation and the affected tests have run"}
      - {from: verified, to: closed, when: "the requester is informed"}
  problem-report:
    states: [open, analysed, in-resolution, resolved, closed, rejected]
    stages: {before-review: [analysed, in-resolution, resolved, closed], before-approval: [in-resolution, resolved, closed]}
    transitions:
      - {from: open, to: analysed, when: "cause, impact and severity are recorded"}
      - {from: analysed, to: in-resolution, when: "a resolution is chosen; a change to baselined items goes through a change request"}
      - {from: in-resolution, to: resolved, when: "the resolution is implemented"}
      - {from: resolved, to: closed, when: "effectiveness is shown by a retest or review that is linked"}
      - {from: [open, analysed], to: rejected, when: "the reason is recorded"}
  query:                           # questions to whoever delivered an input
    states: [open, answered, closed]
    stages: {before-review: [answered, closed], before-approval: [closed]}
    transitions:
      - {from: open, to: answered, when: "the answer and who gave it are recorded"}
      - {from: answered, to: closed, when: "the items the query is about have been brought in line with the answer"}
      - {from: answered, to: open, when: "the answer does not settle the question"}
  action:                          # corrective actions of project management
    states: [open, done, closed, cancelled]
    stages: {before-review: [done, closed], before-approval: [closed]}
    transitions:
      - {from: open, to: done, when: "the action was carried out, as its owner states"}
      - {from: done, to: closed, when: "its effect on the deviation it addresses is shown, in a later status report or review"}
      - {from: done, to: open, when: "the effect did not come about"}
      - {from: [open, done], to: cancelled, when: "the reason is recorded"}
  risk:                            # risks of the project
    states: [identified, analysed, in-treatment, closed, accepted, rejected]
    stages: {before-review: [analysed, in-treatment, closed, accepted], before-approval: [in-treatment, closed]}
    transitions:
      - {from: identified, to: analysed, when: "probability, impact and the analysis are recorded"}
      - {from: analysed, to: in-treatment, when: "treatment actions with owners and dates and the indicators that show progress are recorded"}
      - {from: analysed, to: accepted, when: "the exposure is acceptable by the plan, or a named person accepted it; the decision is recorded"}
      - {from: in-treatment, to: closed, when: "the risk can no longer occur, or it occurred and was handled"}
      - {from: [identified, analysed], to: rejected, when: "it is not a risk of the project; the reason is recorded"}
  record:                          # review records, test runs, baselines, communication records
    states: [open, final]
    stages: {before-review: [final], before-approval: [final]}
    transitions:
      - {from: open, to: final, when: "the record is complete; a final record is never edited, only superseded"}

# ---------------------------------------------------------------------------
# Shared attribute sets
# `required`: always | before-review | before-approval | optional
# (bare yes/no/on/off are avoided on purpose: YAML 1.1 parsers read them as booleans)
# ---------------------------------------------------------------------------
attribute_sets:
  common:
    id: {required: always}
    type: {required: always}
    title: {required: always, note: "short name, not the normative text"}
    status: {required: always}
    variants: {required: optional, note: "product variants the item applies to; absent means all"}
    imported: {required: optional, note: "marks an input received from outside the project's process scope, as {source, version, received, source_id}: document or baseline, its version, the date received, the identifier in the source. Imported items are read-only; only `always` attributes are enforced, and an input acceptance review covers them"}
    rejection_reason: {required: optional, note: "mandatory in state rejected"}
    superseded_by: {required: optional, note: "item ID; reason text is acceptable in state obsolete when nothing replaces the item"}
  criticality:
    asil: {values: [QM, A, B, C, D], required: before-review}
    security_relevant: {values: [true, false], required: before-review}
  requirement:
    kind: {values: [functional, non-functional, interface, constraint], required: before-review}
    priority: {values: [must, should], required: before-review}
    release: {required: before-approval, note: "planned release the requirement is assigned to"}
    verification_method: {values: [test, analysis, review, inspection], required: before-approval}
    origin: {values: [derived, internal], required: before-review, note: "internal = no upstream item exists; needs a rationale section"}
  test-case:
    execution: {values: [automated, manual], required: before-review}
    script: {required: optional, note: "test implementation as <repository path>::<test function>; mandatory before approval when execution is automated"}
    environment: {required: before-approval, note: "host, software-in-the-loop, hardware-in-the-loop, target, or a project-defined name"}
    asil: {values: [QM, A, B, C, D], required: before-review, note: "highest ASIL of the items verified"}
    regression: {values: [true, false], required: before-approval, note: "belongs to the regression set"}

# ---------------------------------------------------------------------------
# Structured attributes: lists of records with fixed keys, so that a script can
# check them. Keys under `mandatory` must be present in every record.
# ---------------------------------------------------------------------------
structures:
  milestones:                      # plan.milestones when kind is project
    mandatory: [name, date]
    keys: [baseline_purpose, release, description]
    dates: [date]
    note: "baseline_purpose names the purpose of the baseline that marks the milestone as reached, as the configuration management plan writes it"
  activities:                      # work-package.activities
    mandatory: [name, owner]
    keys: [estimate, planned_finish, skill, description]
    dates: [planned_finish]
    note: "estimate in person-days; skill names what the activity needs that the owner must bring (MAN.3.BP6)"
  integration-steps:               # plan.integration_steps when kind is software-integration or system-integration
    mandatory: [name, components]
    keys: [doubles, environment, description]
    note: "the steps in the order they are carried out. components: the software components (software-integration; a composition stands for the components inside it) or the system elements (system-integration) added in the step; doubles: what a test double, a simulation or a bench stands in for in the step. A step contains everything added up to it; a component that is never integrated by this project is a double of the last step, and Scope says who integrates it"
  urgent-action:                   # problem-report.urgent_action
    shape: mapping
    mandatory: [action, authorised_by, authorised_at]
    keys: []
    dates: [authorised_at]
    note: "the immediate action decided before the full resolution, or 'none' with the reason; who authorised it and when"
  closure:                         # problem-report.closure
    shape: mapping
    mandatory: [accepted_by, accepted_at, evidence]
    keys: [note]
    dates: [accepted_at]
    note: "the formal acceptance of the closure: who accepted it, when, and the test run or review record that shows the resolution works"
  risk-scale:                      # plan.risk_scale when kind is risk-management
    shape: mapping
    mandatory: [probability_levels, impact_levels, acceptable_up_to]
    keys: [probability_meaning, impact_meaning]
    note: "probability and impact are rated 1 to their number of levels; exposure is their product; a risk whose exposure is at most acceptable_up_to needs no treatment"
  treatment-actions:               # risk.treatment
    mandatory: [action, owner, state]
    keys: [due, done_on]
    dates: [due, done_on]
    note: "state open or done"
  risk-indicators:                 # risk.indicators
    mandatory: [name, threshold]
    keys: [value, as_of]
    dates: [as_of]
    note: "what shows that the risk grows or that its treatment works, the value at which to act, and the last value seen"
  exchanges:                       # supplier-agreement.exchanges
    mandatory: [name, direction, content]
    keys: [due, format]
    note: "direction is to-supplier or from-supplier; due is a date or a rhythm such as 'weekly' or 'with each delivery'"
  meetings:                        # supplier-agreement.meetings
    mandatory: [name, kind, cadence]
    keys: [participants]
    note: "kind is technical or progress; cadence in days between two meetings, or a text"
  open-items:                      # supplier-review.open_items
    mandatory: [id, text, owner, state]
    keys: [due, closes]
    dates: [due]
    note: "state open or closed; closes names <SRV-ID>#<id> of an earlier review of the same agreement that this entry settles"
  quality-checks:                  # plan.quality_checks when kind is quality-assurance
    mandatory: [name, kind, scope]
    keys: [before, when, criteria]
    note: "the checks quality assurance performs: kind work-product or process; scope names item types or process IDs; before lists baseline purposes the check has to precede (COV-43); when says how often otherwise; criteria names the checklist or what is compared"
  escalation-rules:                # plan.escalation when kind is quality-assurance
    mandatory: [after_days, to]
    keys: [channel]
    note: "a non-conformance whose action is overdue by more than after_days is escalated to every party under to (a list); `traceability.py quality` shows which are due"
  quality-findings:                # quality-record.findings
    mandatory: [id, text, action]
    keys: [severity]
    note: "action names the corrective action or problem report that deals with the finding"
  alert-rules:                     # plan.alerts when kind is problem-resolution
    mandatory: [severity, audience]
    keys: [within_days, channel]
    note: "problems of this severity are made known to every party named under audience (a list), within the days given"
  progress:                        # work-package.progress - tracking, not plan: excluded from the content hash
    shape: mapping
    mandatory: []
    keys: [actual_start, actual_effort, completed_on, as_of, note]
    dates: [actual_start, completed_on, as_of]
    note: "stated by the owner of the work package; actual_effort in person-days up to as_of"
  tara-method:                     # plan.tara_method when kind is cybersecurity
    shape: mapping
    mandatory: [impact_categories, impact_meaning, feasibility_approach, feasibility_meaning, risk_matrix]
    keys: [retain_up_to]
    note: "impact_categories: the categories a damage scenario is rated in, for example [safety, financial, operational, privacy]; impact_meaning: what each impact level (severe, major, moderate, negligible) means for this item; feasibility_approach: attack-potential, cvss or attack-vector; feasibility_meaning: what each feasibility level (very-low, low, medium, high) means under that approach; risk_matrix: for each impact level (severe, major, moderate, negligible) the risk values 1 to 5 for the feasibility levels [very-low, low, medium, high], in that order; retain_up_to: the highest risk value the project retains without a decision by a named person. The values are the project's; the standard leaves the method to the organization"
  cybersecurity-activities:        # plan.cybersecurity_activities when kind is cybersecurity
    mandatory: [subclause, decision, responsible]
    keys: [rationale, work_products, due]
    dates: [due]
    note: "one entry per subclause of ISO/SAE 21434 in the clauses of scope.cybersecurity (COV-53); decision is performed, tailored, not-applicable, by-customer or by-supplier; tailored and not-applicable need a rationale that says why the objectives are still reached; by-customer and by-supplier are agreed in the cybersecurity interface agreement"
  shared-activities:               # plan.shared_activities when kind is cybersecurity-interface-agreement
    mandatory: [activity, customer, supplier]
    keys: [exchange, note]
    note: "activity: a subclause or a named activity; customer and supplier: R (performs), A (approves), S (supports), I (is informed) or - ; exchange: what is handed over, and when"
  monitoring-sources:              # plan.monitoring_sources when kind is cybersecurity-monitoring
    mandatory: [name, kind]
    keys: [reviewed, note]
    note: "kind internal or external, for example the project's own tests and field data, supplier notices, vulnerability databases, research; reviewed says how often the source is read"
  monitoring-triggers:             # plan.triggers when kind is cybersecurity-monitoring
    mandatory: [name, condition]
    keys: [action]
    note: "condition: what in the collected information makes it a cybersecurity event for the item, for example a component and version of the item named in an advisory; action: what follows"
  attack-paths:                    # threat-scenario.attack_paths, weakness.attack_paths
    mandatory: [path, feasibility]
    keys: [factors, vector, note]
    note: "path: the steps of the attack from its entry point to the asset; feasibility: high, medium, low or very-low by the approach of the cybersecurity plan; factors: the ratings that led to it (attack potential: elapsed_time, expertise, knowledge, window, equipment; CVSS: the exploitability metrics); vector: the attack vector for the attack-vector approach"
  evaluation-criteria:             # supplier-evaluation.criteria
    mandatory: [criterion, result]
    keys: [evidence, note]
    note: "criterion: what the supplier has to show, for example a process for functional safety or cybersecurity, competence, past assessments, capacity; result met, partly-met or not-met; evidence: what was looked at"
  safety-activities:               # plan.safety_activities when kind is safety
    mandatory: [clause, decision, responsible]
    keys: [rationale, work_products, due]
    dates: [due]
    note: "one entry per clause of the parts of ISO 26262 under scope.safety, written \"<part>:<clause>\" (\"6:7\"); decision performed, tailored, not-applicable, by-customer, by-supplier or by-organization; tailored and not-applicable need a rationale that says how the purpose of the clause is still reached (COV-63)"
  method-selection:                # plan.method_selection when kind is safety
    mandatory: [table, decision]
    keys: [asil, methods, applied_in, rationale]
    note: "one entry per table of ISO 26262 parts 4, 5, 6 and 8 under scope.safety, written \"<part>:<table>\" (\"6:7\"); decision applied or not-applicable; methods: what the project applies for which ASIL, in its own words; applied_in: the plan or strategy that carries the methods; the content of the tables is in the standard and is not copied here (COV-64)"
  confirmation-plan:               # plan.confirmation_measures when kind is safety
    mandatory: [measure, subject, independence]
    keys: [asil, by, when]
    note: "measure confirmation-review, functional-safety-audit or functional-safety-assessment; subject: what it covers, as the confirmation-measure record names it; independence: the level I0 to I3 the project requires, as it reads the standard; by: the role (COV-73)"
  analysis-findings:               # safety-analysis.findings
    mandatory: [id, fault, effect, state]
    keys: [measure, carried_by, rationale, severity]
    note: "fault: the failure mode, cause or initiator; effect: on the element and up to the safety goal; measure: what prevents, detects or controls it; carried_by: the ID of the requirement or element that carries the measure; state open or closed; a closed finding names carried_by or a rationale (COV-68)"
  decomposition:                   # design-decision.decomposition
    shape: mapping
    mandatory: [requirement, into, independence]
    keys: [note]
    note: "requirement: the safety requirement decomposed; into: the requirements it is decomposed into; independence: the dependent failures analysis (safety-analysis of method dfa) that argues their independence (COV-70)"
  data-elements:                   # software-interface.elements
    mandatory: [name, direction, type]
    keys: [unit, min, max, resolution, initial, invalid, period_ms, timeout_ms, description]
    note: "direction is in, out or inout as seen from the providing component; unit and range are expected for physical quantities"
  operations:                      # software-interface.operations
    mandatory: [name]
    keys: [arguments, returns, call_context, reentrant, blocking, description]
    note: "arguments is a list of data-element records; returns is a list of {value, meaning} and is left out for an operation that returns nothing; call_context is task, interrupt or both"
  functions:                       # software-unit.functions
    mandatory: [name, category]
    keys: [description, arguments, return_type, returns, preconditions, postconditions, errors, trigger, period_ms, call_context, reentrant]
    note: "category is public, scheduled, callback or local; arguments is a list of data-element records; the return type is return_type, or the one type given in every returns entry; returns is a list of {type, value, meaning}; errors is a list of {condition, reaction}; trigger names the activating event of a scheduled function"
  data:                            # software-unit.data
    mandatory: [name, type, scope]
    keys: [unit, min, max, initial, protection]
    note: "scope is file or global; protection names what guards concurrent access"
  resource-budget:                 # software-component.resource_budget, software-unit.resource_budget
    shape: mapping                 # one record, not a list
    mandatory: []
    keys: [rom_bytes, ram_bytes, stack_bytes, cpu_load_percent, wcet_us, not_relevant]
    note: "objectives, not measurements; not_relevant carries the reason when no objective applies"
  tasks:                           # architecture-view.table when kind is execution-model
    mandatory: [name, activation, priority, entries]
    keys: [period_ms, budget_us, stack_bytes, preemptable, core]
    note: "activation is periodic, event or interrupt; entries lists the component entry functions mapped to the task"
  memory-regions:                  # architecture-view.table when kind is memory-layout
    mandatory: [name, memory, size_bytes, content]
    keys: [start, protection]
    note: "memory is the kind of storage, for example program flash, data flash, RAM"
  resource-totals:                 # architecture-view.table when kind is resource-summary
    mandatory: [resource, capacity, objective]
    keys: [reserve_percent, measured]
  fault-reactions:                 # architecture-view.table when kind is fault-reaction
    mandatory: [fault, detection, reaction]
    keys: [storage, recovery, escalation]

# ---------------------------------------------------------------------------
# Item types
# ---------------------------------------------------------------------------
types:
  stakeholder-requirement:
    prefix: STK
    folder: spec/stakeholder
    lifecycle: engineering
    supports: [SYS.1.BP1, SYS.1.BP2, SYS.1.BP3, "17-03"]
    attributes:
      use: [common]
      source_document: {required: always, note: "document the stakeholder delivered, with its version"}
      source_id: {required: optional, note: "identifier of the requirement in that document"}
      asil: {values: [QM, A, B, C, D], required: optional, note: "as the source states it"}
      security_relevant: {values: [true, false], required: optional, note: "as the source states it"}
      assessment: {values: [accepted, accepted-with-deviation, rejected, needs-clarification], required: before-approval}
      agreement: {required: optional, note: "communication record ID; mandatory unless assessment is accepted"}
    sections:
      Statement: before-review     # the requirement as received, unchanged
      Assessment notes: optional

  system-requirement:
    prefix: SYR
    folder: spec/system/requirements
    lifecycle: engineering
    supports: [SYS.2.BP1, SYS.2.BP2, SYS.2.BP3, SYS.2.BP4, SYS.2.BP5, "17-12", "17-50", "21434:10.4.1", "21434:WP-10-01", "26262-3:7", "26262-4:6", "26262-4:6.5.1", "26262-8:6", "26262-4:6.5.5"]
    attributes: {use: [common, criticality, requirement]}
    sections:
      Statement: before-review
      Rationale: optional          # mandatory when origin is internal
      Verification criteria: before-approval
      Analysis: optional           # feasibility, cost and schedule impact, effect on the operating environment

  system-element:
    prefix: SYE
    folder: spec/system/architecture
    lifecycle: engineering
    supports: [SYS.3.BP1, SYS.3.BP4, "04-06", "21434:10.4.1", "21434:WP-10-01", "26262-4:6", "26262-4:6.5.3", "26262-4:6.5.2"]
    attributes:
      use: [common, criticality]
      kind: {values: [hardware, software, mechanical, external], required: before-review}
    sections:
      Responsibility: before-review
      Dynamic behavior: before-approval

  system-interface:
    prefix: SYI
    folder: spec/system/architecture
    lifecycle: engineering
    supports: [SYS.3.BP3, "04-06", "17-08", "21434:10.4.1", "21434:WP-10-01", "26262-4:6", "26262-4:6.5.4", "26262-6:6.5.2"]
    attributes:
      use: [common, criticality]
      kind: {values: [hardware-software, bus, electrical, mechanical, diagnostic, external], required: before-review}
    sections:
      Definition: before-review    # signals, ranges, units, timing, protocol
      Dynamic behavior: optional

  software-requirement:
    prefix: SWR
    folder: spec/software/requirements
    lifecycle: engineering
    supports: [SWE.1.BP1, SWE.1.BP2, SWE.1.BP3, SWE.1.BP4, SWE.1.BP5, "17-11", "17-50", "21434:10.4.1", "21434:WP-10-01", "26262-6:6", "26262-6:6.5.1", "26262-8:6"]
    attributes: {use: [common, criticality, requirement]}
    sections:
      Statement: before-review
      Rationale: optional
      Verification criteria: before-approval
      Analysis: optional

  software-component:
    prefix: CMP
    folder: spec/software/architecture
    lifecycle: engineering
    supports: [SWE.2.BP1, SWE.2.BP4, SWE.2.BP5, "04-04", "21434:10.4.1", "21434:WP-10-01", "26262-6:7", "26262-6:7.5.1", "26262-9:6.5.1"]
    attributes:
      use: [common, criticality]
      kind: {values: [composition, application, sensor-actuator, service, complex-driver, ecu-abstraction, parameter, basic-software, library, other], required: before-review}
      layer: {values: [application, runtime-environment, services, ecu-abstraction, microcontroller-abstraction, complex-drivers, several], required: before-review, note: "several: one component stands for a supplied platform that spans layers"}
      origin: {values: [developed, reused, supplied, generated], required: before-review}
      supplier: {required: optional, note: "who delivers it and in which version and form; mandatory when origin is supplied or reused"}
      execution_context: {required: optional, note: "core, partition or operating system application the component runs in"}
      resource_budget: {structure: resource-budget, required: before-approval}
      model: {required: optional, note: "path of the component description (for example an AUTOSAR XML file) this item documents; the model stays the source for ports and runnables"}
    sections:
      Purpose: before-review       # why the component exists
      Responsibility: before-review  # what it does and what it does not do
      Dynamic behavior: before-approval   # the component's own modes and timing; cross-component behavior goes into architecture views

  software-interface:
    prefix: IFC
    folder: spec/software/architecture
    lifecycle: engineering
    supports: [SWE.2.BP3, "04-04", "17-08", "21434:10.4.1", "21434:WP-10-01", "26262-6:7", "26262-6:7.5.1", "26262-6:6.5.2"]
    attributes:
      use: [common, criticality]
      kind: {values: [sender-receiver, client-server, mode-switch, parameter, non-volatile-data, trigger, function-call, debug, other], required: before-review}
      provided_by: {required: before-review, note: "software component ID"}
      used_by: {required: before-approval, note: "software component IDs"}
      elements: {structure: data-elements, required: optional, note: "mandatory before review for data-oriented kinds"}
      operations: {structure: operations, required: optional, note: "mandatory before review for kinds client-server and function-call"}
    sections:
      Description: before-review   # what the interface is for, error behavior, constraints on its use

  architecture-view:               # anything that describes several elements together
    prefix: VIEW
    folder: spec/views
    lifecycle: engineering
    supports: [SYS.3.BP1, SYS.3.BP4, SWE.2.BP1, SWE.2.BP4, SWE.2.BP5, "04-04", "04-06"]
    attributes:
      use: [common]
      level: {values: [system, software], required: always}
      kind: {values: [context, structure, state-machine, sequence, execution-model, memory-layout, resource-summary, fault-reaction, communication, other], required: always}
      table: {required: optional, note: "structured rows; mandatory before review for kinds execution-model (tasks), memory-layout (memory-regions), resource-summary (resource-totals) and fault-reaction (fault-reactions)"}
    sections:
      Description: before-review
      Diagram: optional            # diagram as code; mandatory before review for kinds context, structure, state-machine and sequence

  design-decision:
    prefix: ADR
    folder: spec/decisions
    lifecycle: engineering
    supports: [SYS.3.BP5, SWE.2.BP6, SWE.3.BP4, "26262-9:5", "26262-9:5.5.1", "26262-9:5.5.2"]
    attributes:
      use: [common]
      level: {values: [system, software, detailed-design], required: always}
      decomposition: {structure: decomposition, required: optional, note: "an ASIL decomposition the decision makes (COV-70)"}
    sections:
      Context: before-review
      Evaluation criteria: before-review
      Alternatives: before-review  # each alternative assessed against each criterion
      Decision: before-approval
      Consequences: before-approval

  component-design:                # detailed design of one component as a whole
    prefix: CDS
    folder: spec/software/design
    lifecycle: engineering
    supports: [SWE.3.BP1, SWE.3.BP3, SWE.3.BP4, "04-05", "21434:10.4.1", "21434:WP-10-01", "26262-6:8", "26262-6:8.5.1"]
    attributes: {use: [common]}
    sections:
      Design concept: before-review
      Static structure: before-review      # the units, their relations and visibility
      Dynamic behavior: before-review      # how the units work together, or "not applicable" with the reason
      Design evaluation: before-approval   # result per evaluation criterion of the project, with risks and their owners

  software-unit:
    prefix: UNT
    folder: spec/software/design
    lifecycle: engineering
    supports: [SWE.3.BP1, SWE.3.BP2, SWE.3.BP3, SWE.3.BP8, "04-05", "11-05", "21434:10.4.1", "21434:WP-10-01", "26262-6:8", "26262-6:8.5.1", "26262-6:8.5.2", "26262-9:6.5.1"]
    attributes:
      use: [common, criticality]
      origin: {values: [handwritten, generated, reused, third-party], required: before-review}
      generated_from: {required: optional, note: "model or configuration the unit is generated from; mandatory when origin is generated"}
      source_files: {required: optional, note: "repository paths of the files that implement the unit; each source file belongs to exactly one unit. Empty while the unit is designed but not yet implemented"}
      functions: {structure: functions, required: before-review}
      data: {structure: data, required: optional}
      resource_budget: {structure: resource-budget, required: optional}
      platform: {required: optional, note: "platform resources the unit touches, as a mapping with any of the keys exclusive_areas, interrupts, diagnostic_events, non_volatile_blocks, calibration_parameters, memory_sections, services"}
    sections:
      Purpose: before-review
      Behavior: before-review      # algorithm and states
      Error handling: before-review
      Dynamic behavior: before-review   # or "not applicable" with the reason
      Design notes: optional

  plan:                            # strategies and plans: how a process is going to be performed
    prefix: PLN
    folder: plans
    lifecycle: engineering
    supports: [MAN.3.BP1, MAN.3.BP2, MAN.3.BP3, MAN.3.BP6, MAN.3.BP7, SWE.4.BP1, SWE.5.BP1, SWE.5.BP2, SWE.6.BP1, SYS.4.BP1, SYS.4.BP2, SYS.5.BP1, SUP.1.BP1, SUP.8.BP1, SUP.9.BP1, SUP.10.BP1, "08-12", "08-52", "08-04", "08-13", "08-27", "08-28"]
    attributes:
      use: [common]
      kind: {values: [project, unit-verification, software-integration, software-qualification-test, system-integration, system-qualification-test, configuration-management, quality-assurance, problem-resolution, change-request-management, risk-management, cybersecurity, cybersecurity-interface-agreement, cybersecurity-monitoring, cybersecurity-incident-response, production-control, end-of-cybersecurity-support, safety, development-interface-agreement, release, operation-and-service], required: always}
      milestones: {structure: milestones, required: optional, note: "project plans: the milestones of the life cycle, each with its date and the baseline purpose that marks it"}
      coverage_targets: {required: optional, note: "unit-verification plans: structural coverage a unit must reach, per ASIL, as {<ASIL>: {statement_percent, branch_percent, mcdc_percent}} with any subset of the metrics; an ASIL without an entry has no target"}
      integration_steps: {structure: integration-steps, required: optional, note: "software-integration and system-integration plans: the integration steps in order (conditions)"}
      urgent_severities: {required: optional, note: "problem-resolution plans: the severities for which an urgent action has to be authorised and recorded (conditions)"}
      alerts: {structure: alert-rules, required: optional, note: "problem-resolution plans: who is alerted to problems of which severity (conditions)"}
      quality_checks: {structure: quality-checks, required: optional, note: "quality-assurance plans: the checks of work products and process activities (conditions)"}
      risk_categories: {required: optional, note: "risk-management plans: the kinds of risk the project manages, for example technical, schedule, cost, supplier, safety (conditions)"}
      risk_scale: {structure: risk-scale, required: optional, note: "risk-management plans: the rating scales and the acceptance threshold (conditions)"}
      escalation: {structure: escalation-rules, required: optional, note: "quality-assurance plans: when an overdue non-conformance goes to which level (conditions)"}
      tara_method: {structure: tara-method, required: optional, note: "cybersecurity plans: impact categories, feasibility approach and risk matrix of the TARA (conditions)"}
      cybersecurity_activities: {structure: cybersecurity-activities, required: optional, note: "cybersecurity plans: the activities per subclause of ISO/SAE 21434 in scope, with tailoring (conditions, COV-53)"}
      shared_activities: {structure: shared-activities, required: optional, note: "cybersecurity interface agreements and development interface agreements of ISO 26262: who performs, approves, supports and is informed of each activity (conditions)"}
      monitoring_sources: {structure: monitoring-sources, required: optional, note: "cybersecurity-monitoring plans: where cybersecurity information is collected (conditions)"}
      triggers: {structure: monitoring-triggers, required: optional, note: "cybersecurity-monitoring plans: what makes collected information a cybersecurity event (conditions)"}
      safety_activities: {structure: safety-activities, required: optional, note: "safety plans: the activities per clause of ISO 26262 in scope, with tailoring (conditions, COV-63)"}
      method_selection: {structure: method-selection, required: optional, note: "safety plans: the methods applied per table of parts 4, 5, 6 and 8 in scope (COV-64)"}
      confirmation_measures: {structure: confirmation-plan, required: optional, note: "safety plans: the confirmation reviews, audits and assessment with their independence (COV-73)"}
      asil_determination: {required: optional, note: "safety plans: {S<n>E<n>C<n>: <ASIL>} as the project applies the standard, so that the ASILs of hazardous events are checked (COV-65); absent: not checked"}
      tcl_determination: {required: optional, note: "safety plans: {TI<n>-TD<n>: TCL<n>} as the project applies the standard, so that tool confidence levels are checked (COV-71)"}
    sections:
      Scope: before-review         # what the plan covers and what it leaves to others
      Approach: before-review      # methods, their order, and how they depend on ASIL
      Criteria: before-review      # entry, exit and pass criteria, coverage targets, regression selection
      Environment and tools: before-approval
      Responsibilities: before-approval
      Feasibility: optional        # project plans: mandatory before review (conditions)
      Interfaces and commitments: optional
      Reporting: optional

  work-package:                    # a part of the work breakdown structure, with its schedule
    prefix: WP
    folder: plans/work-packages
    lifecycle: engineering
    supports: [MAN.3.BP4, MAN.3.BP5, MAN.3.BP8, "14-09", "14-06"]
    attributes:
      use: [common]
      owner: {required: always, note: "who answers for the work package, by role or name"}
      category: {values: [engineering, management, support], required: always}
      process: {required: optional, note: "process ID the work serves, for example SWE.3"}
      release: {required: optional}
      estimate: {required: before-review, note: "effort in person-days; how it was reached goes into the section Estimate basis"}
      planned_start: {format: date, required: before-review}
      planned_finish: {format: date, required: before-review}
      activities: {structure: activities, required: optional}
      progress: {structure: progress, required: optional, note: "tracking stated by the owner; not part of the content hash, so it does not make the approved plan stale"}
    sections:
      Description: always          # the work and its boundaries
      Deliverables: before-review  # what it produces; `delivers` links name the items once they exist
      Estimate basis: before-review

  unit-test:
    prefix: UT
    folder: verification/unit
    lifecycle: engineering
    supports: [SWE.4.BP2, "08-50", "26262-6:9", "26262-6:9.5.1", "26262-8:9.5.2"]
    attributes: {use: [common, test-case]}
    sections: {Preconditions: optional, Steps: before-review, Expected result: before-review}

  software-integration-test:
    prefix: SIT
    folder: verification/software-integration
    lifecycle: engineering
    supports: [SWE.5.BP3, SWE.5.BP5, "08-50", "21434:10.4.2", "21434:WP-10-06", "26262-6:10", "26262-6:10.5.1", "26262-8:9.5.2"]
    attributes:
      use: [common, test-case]
      step: {required: before-review, note: "name of the integration step of the software-integration plan whose build the case is run on first; later builds may repeat it as regression"}
    sections: {Preconditions: optional, Steps: before-review, Expected result: before-review}

  software-qualification-test:
    prefix: SQT
    folder: verification/software-qualification
    lifecycle: engineering
    supports: [SWE.6.BP2, SWE.6.BP3, "08-50", "21434:10.4.2", "21434:WP-10-06", "26262-6:11", "26262-6:11.5.1", "26262-8:9.5.2"]
    attributes: {use: [common, test-case]}
    sections: {Preconditions: optional, Steps: before-review, Expected result: before-review}

  system-integration-test:
    prefix: SYIT
    folder: verification/system-integration
    lifecycle: engineering
    supports: [SYS.4.BP3, SYS.4.BP5, "08-50", "21434:10.4.2", "21434:WP-10-06", "26262-4:7", "26262-8:9.5.2"]
    attributes:
      use: [common, test-case]
      step: {required: before-review, note: "name of the integration step of the system-integration plan whose build the case is run on first"}
    sections: {Preconditions: optional, Steps: before-review, Expected result: before-review}

  system-qualification-test:
    prefix: SYQT
    folder: verification/system-qualification
    lifecycle: engineering
    supports: [SYS.5.BP2, SYS.5.BP3, "08-50", "21434:11", "21434:WP-11-01", "26262-4:7", "26262-4:8", "26262-4:8.5.1", "26262-8:9.5.2"]
    attributes: {use: [common, test-case]}
    sections: {Preconditions: optional, Steps: before-review, Expected result: before-review}

  release:                         # a product release: what is delivered from which baseline, approved by whom, to whom
    prefix: REL
    folder: records/releases
    lifecycle: record
    supports: [SPL.2.BP5, SPL.2.BP9, SPL.2.BP10, SPL.2.BP11, SPL.2.BP12, SPL.2.BP13, "26262-2:6", "26262-2:6.5.6", "21434:6.4.9", "21434:WP-06-04", "13-06"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      release: {required: always, note: "name and number of the release, by the numbering scheme of the release plan"}
      kinds: {required: always, note: "list of delivery, release-for-production (ISO 26262), release-for-post-development (ISO/SAE 21434)"}
      baseline: {required: always, note: "the final baseline the release is built from"}
      classification: {required: optional, note: "for example A-sample, B-sample, series, as the release plan classifies"}
      products: {required: always, note: "list of {name, version, file}: what is delivered"}
      build: {required: optional, note: "the build record the delivered software comes from"}
      support: {required: optional, note: "type, service level and duration of support, as communicated"}
      media: {required: optional, note: "delivery medium and packaging"}
      approved_by: {required: always, note: "the person who approved the release for delivery"}
      approved_at: {format: date, required: always}
      delivered_to: {required: always}
      cases: {required: optional, note: "generated: the safety and cybersecurity cases and assessments the release rests on"}
      open_problems: {required: always, may_be_empty: true, note: "generated: unresolved problem reports and weaknesses at the time, with their state"}
      check: {required: always, note: "generated: the summary of the trace check at the time"}
    sections:
      Release note: always         # functional content, changes since the last release, known limitations and open problems, in the words of who releases

  supplier-evaluation:             # the evaluation of a candidate supplier's capability, and the selection decision
    prefix: SEV
    folder: plans/suppliers
    lifecycle: engineering
    supports: ["21434:7.4.1", "21434:7.4.2", "26262-8:5", "26262-8:5.5.1"]
    attributes:
      use: [common]
      supplier: {required: always, note: "the candidate, as the supplier agreement will name it (COV-76)"}
      scope_of_supply: {required: before-review, note: "what the supplier is to deliver"}
      criteria: {structure: evaluation-criteria, required: before-review}
      result: {values: [selected, selected-with-conditions, not-selected], required: before-review}
      decided_by: {required: before-approval, note: "who decided the selection, and when"}
    sections:
      Request for quotation: before-review   # what was asked of the supplier for functional safety and cybersecurity
      Evaluation: before-review              # what the evidence of each criterion showed
      Decision: before-approval              # the selection, its conditions, and who decided

  component-qualification:         # qualification of a software component not developed for this project under the standard
    prefix: CQL
    folder: spec/software/qualification
    lifecycle: engineering
    supports: ["26262-8:12", "26262-8:12.5.1", "26262-8:12.5.2", "26262-8:12.5.3"]
    attributes:
      use: [common]
      version: {required: always, note: "the version of the component that is qualified"}
      method: {required: before-review, note: "analysis of the specification and documentation, tests against the requirements, or both"}
      evidence: {required: before-review, note: "the test runs, reports and documentation the qualification rests on"}
      result: {values: [qualified, qualified-with-restrictions, not-qualified], required: before-review}
      restrictions: {required: optional, note: "mandatory for qualified-with-restrictions"}
    sections:
      Specification: before-review           # what the component does, its interfaces, configuration and assumptions of use
      Qualification: before-review           # what was verified, how, with which results
      Restrictions: optional

  # ---- ISO 26262 (functional safety); active only for the parts under scope.safety

  hazardous-event:                 # a hazard in an operational situation, classified, with its ASIL
    prefix: HZE
    folder: spec/safety/hara
    lifecycle: engineering
    supports: ["26262-3:6", "26262-3:6.5.1"]
    attributes:
      use: [common]
      malfunction: {required: before-review, note: "the malfunctioning behaviour of the item at vehicle level"}
      hazard: {required: before-review}
      operational_situation: {required: before-review}
      severity: {values: [S0, S1, S2, S3], required: before-review}
      exposure: {values: [E0, E1, E2, E3, E4], required: before-review}
      controllability: {values: [C0, C1, C2, C3], required: before-review}
      asil: {values: [QM, A, B, C, D], required: before-review, note: "as the ASIL determination the safety plan states gives it (COV-65)"}
    sections:
      Description: always
      Classification rationale: before-review

  safety-goal:                     # a top-level safety requirement for one or more hazardous events
    prefix: SG
    folder: spec/safety/goals
    lifecycle: engineering
    supports: ["26262-3:6", "26262-3:6.5.1"]
    attributes:
      use: [common]
      asil: {values: [QM, A, B, C, D], required: always, note: "not lower than any hazardous event it addresses (COV-66)"}
      safe_state: {required: optional}
      ftti_ms: {required: optional, note: "fault tolerant time interval in milliseconds, where one applies"}
    sections:
      Statement: before-review
      Rationale: optional

  safety-analysis:                 # FMEA, FTA, DFA or another safety analysis of elements at one level
    prefix: SAN
    folder: spec/safety/analyses
    lifecycle: engineering
    supports: ["26262-9:8", "26262-9:7", "26262-9:6", "26262-9:8.5.1", "26262-9:7.5.1", "26262-6:7", "26262-6:7.5.2", "26262-6:7.5.3", "26262-4:6", "26262-4:6.5.7"]
    attributes:
      use: [common]
      method: {values: [fmea, fta, dfa, fmeda, hazop, stpa, other], required: always}
      level: {values: [system, software, hardware], required: always}
      findings: {structure: analysis-findings, required: before-review, may_be_empty: true}
    sections:
      Scope: before-review           # what is analysed, to which depth, against which safety goals or requirements
      Method: before-review          # how, with which guide words, fault models or initiators
      Results: before-review         # what the analysis shows, beyond the single findings

  tool-evaluation:                 # confidence in the use of a software tool: impact, detection, confidence level
    prefix: TEV
    folder: plans/tools
    lifecycle: engineering
    supports: ["26262-8:11", "26262-8:11.5.1", "26262-8:11.5.2"]
    attributes:
      use: [common]
      tool: {required: always, note: "name and version, as the build, test and analysis records name it (COV-72)"}
      impact: {values: [TI1, TI2], required: before-review}
      detection: {values: [TD1, TD2, TD3], required: before-review}
      confidence: {values: [TCL1, TCL2, TCL3], required: before-review, note: "as the determination the safety plan states gives it (COV-71)"}
      asil: {values: [QM, A, B, C, D], required: before-review, note: "highest ASIL of the work the tool takes part in"}
      qualification_method: {required: optional, note: "mandatory for TCL2 and TCL3 (COV-71)"}
      evidence: {required: optional, note: "the report, test run or record that shows the qualification; mandatory for TCL2 and TCL3"}
    sections:
      Use cases: before-review       # what the tool is used for, on which work products, and which errors it could introduce or fail to detect
      Classification rationale: before-review
      Qualification: optional

  confirmation-measure:            # a confirmation review, a functional safety audit or assessment, by an independent person
    prefix: CFM
    folder: records/safety
    lifecycle: record
    supports: ["26262-2:6", "26262-2:6.5.5", "26262-8:5.5.4"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      kind: {values: [confirmation-review, functional-safety-audit, functional-safety-assessment], required: always}
      subject: {required: always, note: "what the measure covers, as the safety plan's confirmation_measures name it"}
      items: {required: always, may_be_empty: true, note: "generated: the items covered, with state and content hash"}
      performed_by: {required: always}
      independence: {values: [I0, I1, I2, I3], required: always, note: "how independent the person is of the work, as they state it"}
      as_of: {format: date, required: always}
      result: {values: [passed, passed-with-findings, failed, accepted, conditionally-accepted, rejected], required: always}
      conditions: {required: optional}
    sections:
      Report: always

  safety-case:                     # the argument that functional safety is achieved, over the evidence per clause
    prefix: SFC
    folder: records/safety
    lifecycle: record
    supports: ["26262-2:6", "26262-2:6.5.4"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      as_of: {format: date, required: always}
      prepared_by: {required: always}
      parts: {required: always, note: "the parts of ISO 26262 the case covers"}
      clauses: {required: always, note: "generated: per clause the decision of the safety plan and the items that give evidence, with state and hash"}
      findings: {required: always, may_be_empty: true, note: "generated: the open findings of the rules of those parts"}
    sections:
      Argument: always

  # ---- ISO/SAE 21434 (cybersecurity); active only for clauses under scope.cybersecurity

  item-definition:                 # the item: what is protected, its boundary, functions and environment
    prefix: ITM
    folder: spec/cybersecurity/item
    lifecycle: engineering
    supports: ["21434:9.3", "21434:WP-09-01", "26262-3:5", "26262-3:5.5.1"]
    attributes: {use: [common]}
    sections:
      Boundary and functions: before-review     # what belongs to the item, what lies outside, what it does
      Preliminary architecture: before-review   # its elements and interfaces; the system elements where SYS.3 has them
      Operational environment: before-review    # what surrounds the item in use and what it relies on there
      Assumptions: optional

  asset:                           # something of value whose loss of a cybersecurity property leads to damage
    prefix: AST
    folder: spec/cybersecurity/tara
    lifecycle: engineering
    supports: ["21434:15.3", "21434:WP-15-02"]
    attributes:
      use: [common]
      properties: {required: always, note: "list of the cybersecurity properties that matter: confidentiality, integrity, availability, authenticity, authorization, non-repudiation"}
    sections:
      Description: always          # what the asset is and where it is held, processed or carried

  damage-scenario:                 # an adverse consequence for road users, rated per impact category
    prefix: DMG
    folder: spec/cybersecurity/tara
    lifecycle: engineering
    supports: ["21434:15.3", "21434:15.5", "21434:WP-15-01", "21434:WP-15-04"]
    attributes:
      use: [common]
      impact: {required: before-review, note: "{<impact category of the cybersecurity plan>: severe | major | moderate | negligible}; the safety rating follows from the severity of the hazard where ISO 26262 applies (COV-55)"}
    sections:
      Description: always          # the consequence, for whom, and how it comes about
      Impact rationale: before-review

  threat-scenario:                 # a way the property of an asset is lost, its attack paths, risk and treatment
    prefix: THR
    folder: spec/cybersecurity/tara
    lifecycle: engineering
    supports: ["21434:15.4", "21434:15.6", "21434:15.7", "21434:15.8", "21434:15.9", "21434:9.4", "21434:WP-09-02", "21434:WP-15-03", "21434:WP-15-05", "21434:WP-15-06", "21434:WP-15-07", "21434:WP-15-08"]
    attributes:
      use: [common]
      property: {values: [confidentiality, integrity, availability, authenticity, authorization, non-repudiation], required: always, note: "the property of the threatened asset that is lost"}
      attack_paths: {structure: attack-paths, required: before-review}
      feasibility: {values: [high, medium, low, very-low], required: before-review, note: "of the threat scenario: the highest feasibility of its attack paths (COV-56)"}
      risk_value: {values: [1, 2, 3, 4, 5], required: before-review, note: "from the risk matrix of the cybersecurity plan (COV-57); 1 is the lowest risk"}
      treatment: {required: before-review, note: "list of avoid, reduce, share, retain (COV-58)"}
      decision: {required: optional, note: "who decided to retain a risk above retain_up_to of the plan, when and why"}
      residual_risk_value: {values: [1, 2, 3, 4, 5], required: optional, note: "the risk value expected once the controls of the goals act, rated with the same method; a judgement until verification shows the controls effective"}
    sections:
      Description: always          # the attacker's aim, the asset and property, the cause
      Treatment rationale: before-review

  cybersecurity-goal:              # a top-level requirement that protects assets against a threat scenario
    prefix: CSG
    folder: spec/cybersecurity/goals
    lifecycle: engineering
    supports: ["21434:9.4", "21434:WP-09-03"]
    attributes:
      use: [common]
      cal: {values: [CAL1, CAL2, CAL3, CAL4], required: optional, note: "cybersecurity assurance level, where the project uses them"}
    sections:
      Statement: before-review
      Rationale: optional

  cybersecurity-claim:             # the argument for retaining or sharing a risk
    prefix: CLM
    folder: spec/cybersecurity/goals
    lifecycle: engineering
    supports: ["21434:9.4", "21434:WP-09-04"]
    attributes:
      use: [common]
      monitored_by: {required: before-approval, note: "how the claim is watched by the continual activities, for example a trigger of the cybersecurity-monitoring plan"}
    sections:
      Claim: before-review
      Rationale: before-review

  weakness:                        # a weakness found in development or in the field, and whether it is a vulnerability
    prefix: WKN
    folder: records/cybersecurity
    lifecycle: problem-report
    supports: ["21434:8.4", "21434:8.5", "21434:8.6", "21434:10.4.1", "21434:WP-08-04", "21434:WP-08-05", "21434:WP-08-06", "21434:WP-10-05", "21434:WP-08-03"]
    attributes:
      use: [common]
      reported_at: {format: date, required: always}
      found_by: {values: [monitoring, event-evaluation, design, review, test, supplier, customer, field, other], required: always}
      source: {required: always, note: "where it came from: the advisory, notice, test run, review or event, with its identifier"}
      vulnerability: {values: [true, false], required: before-review, note: "the result of the vulnerability analysis"}
      attack_paths: {structure: attack-paths, required: optional, note: "for a vulnerability: how it can be exploited"}
      risk_value: {values: [1, 2, 3, 4, 5], required: optional, note: "mandatory for a vulnerability from state analysed on"}
      treatment: {required: optional, note: "list of avoid, reduce, share, retain; mandatory for a vulnerability from state analysed on (COV-61)"}
      closure: {structure: closure, required: optional, note: "mandatory in state closed"}
    sections:
      Description: always          # what was found, in which version, by whom
      Analysis: before-review      # why it is or is not a vulnerability; for one: exploitability, risk and treatment

  cybersecurity-case:              # the argument that the cybersecurity is adequate, over the work products
    prefix: CSE
    folder: records/cybersecurity
    lifecycle: record
    supports: ["21434:6.4.7", "21434:WP-06-02"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      as_of: {format: date, required: always}
      prepared_by: {required: always, note: "the person who stands behind the argument"}
      clauses: {required: always, note: "the clauses of ISO/SAE 21434 the case covers"}
      work_products: {required: always, note: "generated: per work product of those clauses, the items that provide it with state and hash"}
      findings: {required: always, may_be_empty: true, note: "generated: the open findings of the rules of those clauses at the time"}
    sections:
      Argument: always             # why the cybersecurity is adequate, resting on the work products listed

  cybersecurity-assessment:        # the judgement of an independent assessor on a cybersecurity case
    prefix: CSA
    folder: records/cybersecurity
    lifecycle: record
    supports: ["21434:6.4.8", "21434:WP-06-03"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      as_of: {format: date, required: always}
      assessor: {required: always, note: "the person who gives the judgement"}
      independence: {required: always, note: "how the assessor is independent of the project, as the cybersecurity plan requires"}
      case: {required: always, note: "the cybersecurity case assessed"}
      judgement: {values: [accepted, conditionally-accepted, rejected], required: always}
      conditions: {required: optional, note: "what has to happen for a conditional acceptance to hold"}
    sections:
      Report: always               # what was assessed, how, what was found, and the judgement in the assessor's words

  test-run:                        # written by tooling from test reports, not by hand
    prefix: RUN
    folder: verification/runs
    lifecycle: record
    supports: [SWE.4.BP4, SWE.5.BP5, SWE.5.BP6, SWE.6.BP3, SWE.6.BP4, SYS.4.BP5, SYS.4.BP6, SYS.5.BP3, SYS.5.BP4, "13-50", "21434:WP-10-07", "21434:WP-11-01", "26262-6:9.5.2", "26262-6:10.5.3", "26262-6:11.5.2", "26262-4:7.5.2", "26262-8:9.5.3"]   # a run records which test cases were selected and what they showed
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      level: {values: [unit, software-integration, software-qualification, system-integration, system-qualification], required: always}
      item_under_test: {required: always, note: "commit, tag or baseline ID that was tested"}
      environment: {required: always}
      executed_at: {required: always}
      results: {required: always, note: "list of {test: <test case ID>, verdict: passed | failed | blocked | not-run, evidence: <report path>, reason: <why blocked or not run>}"}
      coverage: {required: optional, note: "unit level: list of {unit, file, statement_percent, branch_percent, mcdc_percent, deviation} taken from the coverage report, or a text saying why coverage was not measured; deviation carries the accepted reason for a figure below target"}
      sources: {required: optional, note: "list of {file, hash} of the unit sources and test files at the time of the run; written by tooling"}
      build: {required: optional, note: "software-integration and software-qualification levels: the build record of the integrated software that was tested"}
      selection: {required: optional, note: "how the test cases of the run were chosen, in the terms of the test strategy (all, regression set, impact of a change)"}

  build-record:                    # written by tooling from the manifest a build writes
    prefix: BLD
    folder: verification/builds
    lifecycle: record
    supports: [SWE.5.BP4, SYS.4.BP4, "01-50", "17-02", "26262-6:10", "26262-6:10.5.2"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      level: {values: [software, system], required: optional, note: "absent means software"}
      step: {required: always, note: "the integration step of the integration plan of the level that the build carries out"}
      item_under_test: {required: always, note: "commit or tag the build was made from"}
      tool: {required: always, note: "build tool and compiler, with versions"}
      executed_at: {required: always}
      result: {values: [succeeded, failed], required: always}
      contents: {required: always, note: "list of {component, units} or {component, delivered}: what was integrated, per software component - the units built from the project's sources, or the version of an item integrated as received; at system level {component: <system element>, delivered: <version>, build: <software build record>}; generated"}
      doubles: {required: optional, note: "list of {component, file} (software) or {component, description} (system): what stood in for elements not integrated in the step"}
      sources: {required: optional, note: "software level: list of {file, hash} of every file built, doubles included; written by tooling"}
      evidence: {required: optional, note: "path of the kept build log"}

  static-analysis-run:             # written by tooling from analyser reports
    prefix: SAR
    folder: verification/runs
    lifecycle: record
    supports: [SWE.4.BP3, "13-25"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      item_under_test: {required: always}
      tool: {required: always, note: "analyser, version and rule set"}
      executed_at: {required: always}
      results: {required: always, note: "list of {unit: <software unit ID>, open_findings: <count by severity>, deviations: <justified deviations>, metrics: <values>, evidence: <report path>}"}
      sources: {required: optional, note: "list of {file, hash} of the unit sources at the time of the run; written by tooling"}

  review-record:
    prefix: REV
    folder: records/reviews
    lifecycle: record
    supports: [SUP.1.BP2, SUP.4.BP4, "13-19", "21434:WP-09-05", "21434:WP-09-07", "21434:WP-10-04", "26262-3:6.5.2", "26262-3:7.5.2", "26262-6:6.5.3", "26262-6:7.5.4", "26262-9:7.5.2", "26262-9:8.5.2", "26262-8:9.5.3", "26262-4:6.5.6"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      subject: {required: always, note: "list of {item: <ID>, hash: <content hash at review time>}"}
      references: {required: optional, note: "list of {item: <ID>, hash: <content hash>}: the upstream items the subject was compared against. This is the consistency evidence; a link whose target has changed since is suspect"}
      checklist: {required: always, note: "checklist applied, with its version"}
      reviewers: {required: always, note: "people accountable for the verdict; at least one who did not author the subject"}
      verdict: {values: [approved, rework], required: always}
      findings: {required: always, may_be_empty: true, note: "list of {id, item, text, severity: major | minor, state: open | closed, closes: <REV-ID>#<finding id>}; an empty list states that there were none; closes marks an entry that settles an open finding of an earlier review of the same content"}
      reviewed_at: {required: optional}
      checks: {required: optional, note: "list of {check: <checklist ID>, result: pass | finding | not-applicable | not-assessed, note}: what each check of the checklist gave, including the answers to accountable checks"}
      checklist_source: {values: [toolkit, external, reconfirmation], required: optional, note: "toolkit: a checklist under .claude/docs/checklists at the cited version; external: criteria from outside the toolkit, named in `checklist`; reconfirmation: unchanged items confirmed against new versions of what they build on"}
      checklist_hash: {required: optional, note: "file hash of the toolkit checklist that was applied; written by tooling"}
      item_under_test: {required: optional, note: "commit, tag or baseline ID of the code that was reviewed"}
      sources: {required: optional, note: "list of {file, hash} of the source files of the units reviewed; written by tooling"}
      rests_on: {required: optional, note: "reconfirmation only: the earlier approving review records of the subjects, whose checks the reconfirmation does not repeat"}

  communication-record:
    prefix: CMR
    folder: records/communication
    lifecycle: record
    supports: [SYS.2.BP8, SYS.3.BP8, SYS.4.BP9, SYS.5.BP7, SWE.1.BP8, SWE.2.BP9, SWE.3.BP7, SWE.4.BP7, SWE.5.BP9, SWE.6.BP7, SUP.1.BP4, SUP.1.BP6, SUP.9.BP6, ACQ.4.BP2, "13-04"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      subject: {required: always, note: "baseline ID, or the items and test runs that were communicated"}
      audience: {required: always, note: "roles or parties informed"}
      channel: {required: always, note: "how they were informed"}
      sent_at: {required: always}
      agreement: {required: optional, note: "what was agreed and by whom, when the record documents an agreement rather than a notification"}
      practices: {required: optional, note: "the communicate practices the record serves, for example [SWE.1.BP8], or the subclause of ISO/SAE 21434 it belongs to, for example \"21434:15.9\"; without it, `practices` counts the record for every communicate practice"}

  query:
    prefix: QRY
    folder: records/queries
    lifecycle: query
    supports: [SYS.1.BP6]
    attributes:
      use: [common]
      to: {required: always, note: "who the question goes to: the source of the input, by role or name"}
      asked_at: {required: optional, note: "the date the question was put to the source; empty while it is written down and not sent yet"}
      answered_by: {required: before-review, note: "who answered, and when"}
    sections:
      Question: always
      Answer: before-review

  change-request:
    prefix: CR
    folder: records/changes
    lifecycle: change-request
    supports: [SUP.10.BP2, SUP.10.BP3, SUP.10.BP4, SUP.10.BP5, SUP.10.BP6, SUP.10.BP7, SYS.1.BP5, "13-16", "13-21", "26262-8:8", "26262-8:8.5.2", "26262-8:8.5.3", "26262-8:8.5.4", "21434:13.4", SUP.8.BP5]
    attributes:
      use: [common]
      requester: {required: always}
      decision: {required: optional, note: "who decided and when; mandatory from state approved or rejected on"}
    sections:
      Description: always
      Impact analysis: before-review     # affected items, effort, schedule, risk, regression scope

  risk:
    prefix: RSK
    folder: records/risks
    lifecycle: risk
    supports: [MAN.5.BP3, MAN.5.BP4, MAN.5.BP5, MAN.5.BP6, "15-08", "08-20"]
    attributes:
      use: [common]
      category: {required: always, note: "one of the risk_categories of the risk-management plan"}
      owner: {required: always}
      identified_at: {format: date, required: always}
      identified_in: {required: always, note: "the plan, decision, change request, problem or meeting that brought the risk up"}
      probability: {required: before-review, note: "1 to probability_levels of the plan"}
      impact: {required: before-review, note: "1 to impact_levels of the plan"}
      treatment: {structure: treatment-actions, required: optional, note: "mandatory in state in-treatment"}
      indicators: {structure: risk-indicators, required: optional, note: "mandatory in state in-treatment (COV-52)"}
      decision: {required: optional, note: "who accepted the risk, when and why; mandatory in state accepted when the exposure is above the threshold"}
    sections:
      Description: always          # cause, event and consequence
      Analysis: before-review      # why this probability and this impact
      Treatment and monitoring: before-approval   # what is done, how its effect shows, when to act further

  problem-report:
    prefix: PRB
    folder: records/problems
    lifecycle: problem-report
    supports: [SUP.9.BP2, SUP.9.BP3, SUP.9.BP4, SUP.9.BP7, SUP.9.BP8, "13-07"]
    attributes:
      use: [common]
      severity: {values: [critical, major, minor], required: always}
      reported_by: {required: always, note: "who found and reported the problem, by role or name"}
      reported_at: {format: date, required: always}
      detected_by: {values: [review, static-analysis, unit-test, integration-test, qualification-test, system-test, customer, field, other], required: always, note: "the activity that exposed the problem"}
      found_in: {required: always, note: "commit, tag or baseline ID, and the test run or review that exposed it"}
      origin: {values: [input, requirements, architecture, design, code, test-specification, test-environment, tool, other], required: before-review, note: "the work product in which the cause lies, once the cause is known"}
      urgent_action: {structure: urgent-action, required: optional, note: "mandatory for a severity the problem-resolution plan names as urgent (COV-39)"}
      closure: {structure: closure, required: optional, note: "mandatory in state closed"}
    sections:
      Description: always               # what happens, how to reproduce it, in which environment
      Cause and impact: before-review   # the cause, what else is affected: other items, variants, releases, parties
      Resolution: before-approval       # what is done about it: the actions, or the change request that carries them

  corrective-action:
    prefix: CA
    folder: records/actions
    lifecycle: action
    supports: [MAN.3.BP10, SUP.1.BP5, ACQ.4.BP5, MAN.5.BP7, "14-02"]
    attributes:
      use: [common]
      owner: {required: always}
      due: {format: date, required: always}
      raised_in: {required: always, note: "the status report, review or meeting that showed the deviation"}
    sections:
      Deviation: always            # what differs from the plan, with the figures
      Action: always               # what is done about it, and how the cause is kept from coming back
      Effect: before-approval      # what showed that it worked

  project-status-report:
    prefix: PSR
    folder: records/status
    lifecycle: record
    supports: [MAN.3.BP10, MAN.5.BP6, "15-06", "15-09"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      as_of: {format: date, required: always}
      period: {required: optional}
      reported_by: {required: always, note: "the person who stands behind the assessment"}
      work_packages: {required: always, may_be_empty: true, note: "generated from `traceability.py progress`"}
      milestones: {required: optional, note: "generated"}
      corrective_actions: {required: optional, note: "generated"}
      check: {required: optional, note: "summary of the trace check at the time of the report; generated"}
      risks: {required: optional, note: "generated from `traceability.py risks` when risks exist: per risk its state and exposure, and the figures"}
    sections:
      Assessment: always           # the reporter's reading of the figures, risks and what is decided

  supplier-agreement:              # what the project and one supplier agreed on: joint processes, interfaces, exchanges, meetings
    prefix: SAG
    folder: plans/suppliers
    lifecycle: engineering
    supports: [ACQ.4.BP1, "02-01", "26262-8:5", "26262-8:5.5.5", "26262-8:5.5.3"]
    attributes:
      use: [common]
      supplier: {required: always, note: "the supplier, by name or role, and the contract or order the agreement belongs to"}
      components: {required: before-review, note: "IDs of the software components or system elements the supplier delivers"}
      exchanges: {structure: exchanges, required: before-review}
      meetings: {structure: meetings, required: before-review}
    sections:
      Joint processes: before-review           # which processes each side performs, and how they meet (reviews, change requests, problems)
      Interfaces and responsibilities: before-review
      Deviations and escalation: before-approval   # how missed objectives are handled, who escalates to whom

  supplier-review:                 # a technical or progress review with a supplier: minutes and open items
    prefix: SRV
    folder: records/suppliers
    lifecycle: record
    supports: [ACQ.4.BP3, ACQ.4.BP4, "13-09", "13-14"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      agreement: {required: always, note: "the supplier agreement the review is held under"}
      kind: {values: [technical, progress], required: always}
      held_at: {format: date, required: always}
      participants: {required: always, note: "who took part, on both sides, by name or role"}
      open_items: {structure: open-items, required: always, may_be_empty: true}
    sections:
      Minutes: always              # what was reviewed - for progress: schedule, quality, cost against the agreement; for technical: the matters, problems and risks - and what was decided

  quality-record:                  # a check by quality assurance, with the facts the tools showed and the person's verdict
    prefix: QAR
    folder: records/quality
    lifecycle: record
    supports: [SUP.1.BP2, SUP.1.BP3, SUP.1.BP4, "13-18"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      kind: {values: [work-product, process, summary], required: always, note: "summary: the periodic report of quality assurance over the checks since the last one"}
      check: {required: optional, note: "name of the quality check of the quality-assurance plan this record carries out"}
      subject: {required: always, note: "the items checked (work-product), the processes (process), or the quality records summarised (summary)"}
      criteria: {required: always, note: "what was checked against: checklist and version, plan, strategy section"}
      checked_by: {required: always, note: "the person in the quality assurance role who stands behind the verdict"}
      checked_at: {format: date, required: always}
      result: {values: [conforms, conforms-with-findings, does-not-conform], required: always}
      findings: {structure: quality-findings, required: always, may_be_empty: true}
      facts: {required: always, note: "generated: what the tools showed at the time - per item its state, hash and approving review; per process the evidence per base practice; for a summary the figures of `traceability.py quality`"}
    sections:
      Summary: always              # the verdict in the checker's words: what was looked at, what was found, what follows

  self-assessment:                 # a mock assessment: ratings named people give, checked for consistency by tooling
    prefix: SAS
    folder: records/assessments
    lifecycle: record
    supports: []                   # preparation for an assessment, not evidence of a practice
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      as_of: {format: date, required: always}
      assessors: {required: always, note: "the people who gave the ratings; a self-assessment of the team, not an assessment"}
      processes: {required: always}
      target_level: {required: optional}
      ratings: {required: always, note: "list of {practice, rating: N | P | L | F, note}: one entry per base practice of the processes"}
      attribute_ratings: {required: optional, note: "list of {process, attribute, rating, note}, for example PA 1.1"}
      generic_ratings: {required: optional, note: "level 2: list of {process, practice: GP 2.1.1 ..., rating, note}"}
      generic_observations: {required: optional, note: "generated: the state of each generic practice in `generic` at the time"}
      observations: {required: always, note: "generated: the state of each base practice in `practices` at the time"}
      consistency: {required: always, may_be_empty: true, note: "generated: ratings that differ from the observation or exceed the rating of a practice they depend on, with the note the assessors gave"}
    sections:
      Summary: always              # strengths, weaknesses and the actions the assessors propose

  problem-trend-report:            # problem status and trends as of a date, with the analyst's reading
    prefix: PTR
    folder: records/problem-trends
    lifecycle: record
    supports: [SUP.9.BP3, SUP.9.BP8, SUP.9.BP9, "15-12"]
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      title: {required: optional}
      as_of: {format: date, required: always}
      period: {required: optional}
      reported_by: {required: always, note: "the person who stands behind the analysis"}
      problems: {required: always, may_be_empty: true, note: "generated from `traceability.py problems`: one entry per problem with state, severity, origin, detection and age"}
      figures: {required: always, note: "generated: counts by state, severity, origin and detection, opened and closed in the period, open problems by age"}
    sections:
      Assessment: always           # the analyst's reading: trends, recurring causes, and the actions decided

  baseline:
    prefix: BL
    folder: records/baselines
    lifecycle: record
    supports: [SUP.8.BP6, SUP.8.BP7, SYS.1.BP4, "13-08", "26262-8:7", SUP.8.BP5, SUP.8.BP8]   # the record lists every item with hash and status
    attributes:
      id: {required: always}
      type: {required: always}
      status: {required: always}
      tag: {required: always, note: "version control tag the baseline is anchored to"}
      purpose: {required: always, note: "for example requirements freeze, release candidate, delivery"}
      created_at: {required: optional}
      items: {required: always, note: "list of {item: <ID>, hash: <content hash>, status}; generated"}
      left_out: {required: optional, note: "list of {item: <ID>, status}: live engineering items not in the baseline; generated"}
      left_out_reason: {required: optional, note: "why items of processes in scope that are not approved stay out, as the user states it"}

# ---------------------------------------------------------------------------
# Plan kinds and the strategy practices they answer. A process in scope needs an
# approved plan of every kind that names one of its base practices (COV-27); a
# clause of ISO/SAE 21434 in scope, one of every kind that names one of its subclauses.
# ---------------------------------------------------------------------------
plan_kinds:
  project: [MAN.3.BP1, MAN.3.BP2, MAN.3.BP3, MAN.3.BP6, MAN.3.BP7]
  unit-verification: [SWE.4.BP1, "26262-6:9", "26262-8:9", "26262-8:9.5.1"]
  software-integration: [SWE.5.BP1, SWE.5.BP2, "26262-6:10", "26262-8:9", "26262-8:9.5.1"]
  software-qualification-test: [SWE.6.BP1, "26262-6:11", "26262-8:9", "26262-8:9.5.1"]
  system-integration: [SYS.4.BP1, SYS.4.BP2, "26262-4:7", "26262-4:7.5.1"]
  system-qualification-test: [SYS.5.BP1]
  configuration-management: [SUP.8.BP1, "26262-8:7", "26262-8:7.5.1", "26262-8:10", "26262-8:10.5.1", "26262-8:10.5.2", SUP.8.BP2, SUP.8.BP3, SUP.8.BP4, SUP.8.BP9]
  quality-assurance: [SUP.1.BP1]
  problem-resolution: [SUP.9.BP1]
  risk-management: [MAN.5.BP1, MAN.5.BP2]
  change-request-management: [SUP.10.BP1, "26262-8:8", "26262-8:8.5.1"]
  cybersecurity: ["21434:6.4.1", "21434:6.4.2", "21434:6.4.3", "21434:6.4.4", "21434:6.4.5", "21434:6.4.6", "21434:15.8", "21434:WP-06-01", "21434:WP-10-03"]
  cybersecurity-interface-agreement: ["21434:7.4.3", "21434:WP-07-01"]
  cybersecurity-monitoring: ["21434:8.3", "21434:WP-08-01", "21434:WP-08-02"]
  cybersecurity-incident-response: ["21434:13.3", "21434:WP-13-01"]
  production-control: ["21434:12", "21434:WP-12-01", "21434:WP-10-02", "26262-7:5", "26262-7:6", "26262-7:6.5.1", "26262-7:6.5.2"]
  end-of-cybersecurity-support: ["21434:14.3", "21434:WP-14-01", "21434:14.4"]
  safety: ["26262-2:6", "26262-2:6.5.3", "26262-4:5", "26262-5:5", "26262-6:5", "26262-2:6.5.1", "26262-2:6.5.2", "26262-6:5.5.1"]
  development-interface-agreement: ["26262-8:5", "26262-8:5.5.2"]
  release: [SPL.2.BP1, SPL.2.BP2, SPL.2.BP3, SPL.2.BP4, SPL.2.BP6, SPL.2.BP7, SPL.2.BP8]
  operation-and-service: ["26262-7:5", "26262-7:7", "26262-7:7.5.1"]

# ---------------------------------------------------------------------------
# Conditional requirements: attributes or sections that become mandatory when
# another attribute has a given value. `stage` as for `required`.
# `types: any` means every type that carries the attributes named.
# ---------------------------------------------------------------------------
conditions:
  - {types: [system-requirement, software-requirement], when: {origin: [internal]}, sections: [Rationale], stage: before-review}
  - {types: [stakeholder-requirement], when: {assessment: [accepted-with-deviation, rejected, needs-clarification]}, attributes: [agreement], stage: before-approval}
  - {types: [software-component], when: {origin: [supplied, reused]}, attributes: [supplier], stage: before-review}
  - {types: [plan], when: {kind: [project]}, attributes: [milestones], structure: milestones, sections: [Feasibility, Interfaces and commitments, Reporting], stage: before-review}
  - {types: [plan], when: {kind: [software-integration, system-integration]}, attributes: [integration_steps], structure: integration-steps, stage: before-review}
  - {types: [software-interface], when: {kind: [sender-receiver, mode-switch, parameter, non-volatile-data]}, attributes: [elements], stage: before-review}
  - {types: [software-interface], when: {kind: [client-server, function-call]}, attributes: [operations], stage: before-review}
  - {types: [architecture-view], when: {kind: [context, structure, state-machine, sequence]}, sections: [Diagram], stage: before-review}
  - {types: [architecture-view], when: {kind: [execution-model]}, attributes: [table], structure: tasks, stage: before-review}
  - {types: [architecture-view], when: {kind: [memory-layout]}, attributes: [table], structure: memory-regions, stage: before-review}
  - {types: [architecture-view], when: {kind: [resource-summary]}, attributes: [table], structure: resource-totals, stage: before-review}
  - {types: [architecture-view], when: {kind: [fault-reaction]}, attributes: [table], structure: fault-reactions, stage: before-review}
  - {types: [software-unit], when: {origin: [generated]}, attributes: [generated_from], stage: before-review}
  - {types: [unit-test, software-integration-test, software-qualification-test, system-integration-test, system-qualification-test], when: {execution: [automated]}, attributes: [script], stage: before-approval}
  - {types: [plan], when: {kind: [problem-resolution]}, attributes: [urgent_severities], stage: before-review}
  - {types: [plan], when: {kind: [problem-resolution]}, attributes: [alerts], structure: alert-rules, stage: before-review}
  - {types: [problem-report], when: {status: [closed]}, attributes: [closure], structure: closure, stage: always}
  - {types: [plan], when: {kind: [risk-management]}, attributes: [risk_categories], stage: before-review}
  - {types: [plan], when: {kind: [risk-management]}, attributes: [risk_scale], structure: risk-scale, stage: before-review}
  - {types: [risk], when: {status: [in-treatment]}, attributes: [treatment], structure: treatment-actions, stage: always}
  - {types: [risk], when: {status: [in-treatment]}, attributes: [indicators], structure: risk-indicators, stage: always}
  - {types: [plan], when: {kind: [quality-assurance]}, attributes: [quality_checks], structure: quality-checks, stage: before-review}
  - {types: [plan], when: {kind: [quality-assurance]}, attributes: [escalation], structure: escalation-rules, stage: before-review}
  - {types: [plan], when: {kind: [cybersecurity]}, attributes: [tara_method], structure: tara-method, stage: before-review}
  - {types: [plan], when: {kind: [cybersecurity]}, attributes: [cybersecurity_activities], structure: cybersecurity-activities, stage: before-review}
  - {types: [plan], when: {kind: [cybersecurity-interface-agreement, development-interface-agreement]}, attributes: [shared_activities], structure: shared-activities, stage: before-review}
  - {types: [plan], when: {kind: [cybersecurity-monitoring]}, attributes: [monitoring_sources], structure: monitoring-sources, stage: before-review}
  - {types: [plan], when: {kind: [cybersecurity-monitoring]}, attributes: [triggers], structure: monitoring-triggers, stage: before-review}
  - {types: [weakness], when: {status: [closed]}, attributes: [closure], structure: closure, stage: always}
  - {types: [plan], when: {kind: [safety]}, attributes: [safety_activities], structure: safety-activities, stage: before-review}
  - {types: [plan], when: {kind: [safety]}, attributes: [method_selection], structure: method-selection, stage: before-review}
  - {types: [plan], when: {kind: [safety]}, attributes: [confirmation_measures], structure: confirmation-plan, stage: before-review}
  - {types: [tool-evaluation], when: {confidence: [TCL2, TCL3]}, attributes: [qualification_method, evidence], stage: before-review}
  - {types: [component-qualification], when: {result: [qualified-with-restrictions]}, attributes: [restrictions], stage: before-review}
  - {types: [weakness], when: {vulnerability: [true]}, attributes: [risk_value, treatment], stage: before-review}
  - {types: any, when: {status: [rejected]}, attributes: [rejection_reason], stage: always}
  - {types: [change-request], when: {status: [approved, rejected, implemented, verified, closed]}, attributes: [decision], stage: always}

# ---------------------------------------------------------------------------
# Link roles (stored on `from`, navigable both ways)
# ---------------------------------------------------------------------------
links:
  derived_from:
    meaning: "the item states at its own level what the target requires"
    pairs:
      - {from: system-requirement, to: [stakeholder-requirement], supports: [SYS.2.BP6, SYS.2.BP7]}
      - {from: software-requirement, to: [system-requirement, system-element, system-interface], supports: [SWE.1.BP6, SWE.1.BP7]}
      - {from: system-requirement, to: [cybersecurity-goal], supports: ["21434:9.5", "21434:WP-09-06"]}
      - {from: software-requirement, to: [cybersecurity-goal], supports: ["21434:9.5", "21434:10.4.1", "21434:WP-09-06"]}
      - {from: system-requirement, to: [safety-goal], supports: ["26262-3:7", "26262-3:7.5.1"]}
      - {from: software-requirement, to: [safety-goal], supports: ["26262-6:6", "26262-6:6.5.1"]}
      - {from: software-requirement, to: [safety-analysis], supports: ["26262-9:8", "26262-6:7"]}
      - {from: system-requirement, to: [safety-analysis], supports: ["26262-9:8", "26262-4:6"]}
  fulfils:
    meaning: "the requirement is allocated to this architectural element. The link is stored on the element because the element depends on the requirement: when the requirement changes, the element becomes suspect"
    pairs:
      - {from: system-element, to: [system-requirement], supports: [SYS.3.BP2, SYS.3.BP6, SYS.3.BP7]}
      - {from: system-interface, to: [system-requirement], supports: [SYS.3.BP2, SYS.3.BP6, SYS.3.BP7]}
      - {from: software-component, to: [software-requirement], supports: [SWE.2.BP2, SWE.2.BP7, SWE.2.BP8]}
      - {from: software-interface, to: [software-requirement], supports: [SWE.2.BP2, SWE.2.BP7, SWE.2.BP8]}
  part_of:
    meaning: "the item belongs to the target: a component to its composition, a unit to its component"
    pairs:
      - {from: software-component, to: [software-component], supports: [SWE.2.BP1]}
      - {from: software-unit, to: [software-component], supports: [SWE.3.BP5, SWE.3.BP6]}
      - {from: work-package, to: [work-package], supports: [MAN.3.BP4], evidence: none}
  relies_on:
    meaning: "the requirement uses a term, a value or a behaviour that the target requirement defines; a change of the target makes it suspect"
    pairs:
      - {from: software-requirement, to: [software-requirement], supports: [SWE.1.BP3]}
      - {from: system-requirement, to: [system-requirement], supports: [SYS.2.BP3]}
  refines:
    meaning: "the detailed design of the component"
    pairs:
      - {from: component-design, to: [software-component], supports: [SWE.3.BP5, SWE.3.BP6]}
  realizes:
    meaning: "the item implements the target interface"
    pairs:
      - {from: software-interface, to: [system-interface], supports: [SWE.2.BP3]}
      - {from: software-unit, to: [software-interface], supports: [SWE.3.BP2, SWE.3.BP5]}
  uses:
    meaning: "the unit depends on the target at run time"
    pairs:
      - {from: software-unit, to: [software-interface, software-unit], supports: [SWE.3.BP2]}
  implements:
    meaning: "the unit realises this requirement directly; optional where the path through the component already covers it"
    pairs:
      - {from: software-unit, to: [software-requirement], supports: [SWE.3.BP5, SWE.3.BP6]}
  shows:
    meaning: "the view describes the target together with others; a change of the target makes the view suspect"
    pairs:
      - {from: architecture-view, to: [system-element, system-interface, software-component, software-interface], supports: [SYS.3.BP4, SWE.2.BP4]}
  verifies:
    meaning: "the test case checks the target; a unit test may point at one function with <ID>#<name>"
    pairs:
      - {from: unit-test, to: [software-unit], supports: [SWE.4.BP5, SWE.4.BP6]}
      - {from: software-integration-test, to: [software-component, software-interface, architecture-view], supports: [SWE.5.BP7, SWE.5.BP8]}
      - {from: software-qualification-test, to: [software-requirement], supports: [SWE.6.BP5, SWE.6.BP6]}
      - {from: system-integration-test, to: [system-element, system-interface, architecture-view], supports: [SYS.4.BP7, SYS.4.BP8]}
      - {from: system-qualification-test, to: [system-requirement], supports: [SYS.5.BP5, SYS.5.BP6]}
      - {from: system-qualification-test, to: [cybersecurity-goal], supports: ["21434:11", "21434:WP-11-01"]}
      - {from: system-qualification-test, to: [safety-goal], supports: ["26262-4:8", "26262-4:8.5.2"]}
  concerns:
    meaning: "the decision shapes the target"
    pairs:
      - {from: design-decision, to: [system-requirement, software-requirement, system-element, system-interface, software-component, software-interface, architecture-view, component-design, software-unit], supports: [SYS.3.BP5, SWE.2.BP6, SWE.3.BP4]}
  about:
    meaning: "the query asks about the target"
    pairs:
      - {from: query, to: any, supports: [SYS.1.BP6]}
  affects:
    meaning: "the change or problem touches the target"
    pairs:
      - {from: change-request, to: any, supports: [SUP.10.BP8]}
      - {from: problem-report, to: any, supports: [SUP.9.BP4]}
      - {from: weakness, to: any, supports: ["21434:8.5", "21434:8.6"]}
  delivers:
    meaning: "the work package produces the target; its progress is read from the target's state"
    pairs:
      - {from: work-package, to: any, supports: [MAN.3.BP4, MAN.3.BP9], evidence: none}
  depends_on:
    meaning: "the work package can start only when the target has finished"
    pairs:
      - {from: work-package, to: [work-package], supports: [MAN.3.BP4, MAN.3.BP8], evidence: none}
  addresses:
    meaning: "the item deals with the target: a corrective action with a deviation in it, a cybersecurity goal or claim with the risk of a threat scenario or a vulnerability"
    pairs:
      - {from: corrective-action, to: any, supports: [MAN.3.BP10], evidence: none}
      - {from: cybersecurity-goal, to: [threat-scenario], supports: ["21434:9.4", "21434:15.9"]}
      - {from: cybersecurity-claim, to: [threat-scenario, weakness], supports: ["21434:9.4", "21434:15.9", "21434:8.6"]}
      - {from: safety-goal, to: [hazardous-event], supports: ["26262-3:6"]}
  resolves:
    meaning: "the change request carries the resolution of the problem or the vulnerability"
    pairs:
      - {from: change-request, to: [problem-report], supports: [SUP.10.BP8]}
      - {from: change-request, to: [weakness], supports: [SUP.10.BP8, "21434:8.6"]}
  arises_in:
    meaning: "the hazardous event is one of the item's; a change of the item definition makes it suspect"
    pairs:
      - {from: hazardous-event, to: [item-definition], supports: ["26262-3:6"]}
  analyses:
    meaning: "the safety analysis examines the target; a change of the target makes the analysis suspect"
    pairs:
      - {from: safety-analysis, to: [item-definition, system-element, system-interface, software-component, software-interface, software-unit, architecture-view, design-decision], supports: ["26262-9:8", "26262-9:7", "26262-6:7", "26262-4:6"]}
  qualifies:
    meaning: "the qualification shows the component fit for its use here; a change of the component makes it suspect"
    pairs:
      - {from: component-qualification, to: [software-component], supports: ["26262-8:12"]}
  located_in:
    meaning: "the asset is held, processed or carried by the target; a change of the target makes the asset suspect"
    pairs:
      - {from: asset, to: [item-definition, system-element, system-interface, software-component, software-interface], supports: ["21434:15.3"]}
  threatens:
    meaning: "the threat scenario takes a cybersecurity property of the target asset"
    pairs:
      - {from: threat-scenario, to: [asset], supports: ["21434:15.4"]}
  leads_to:
    meaning: "the threat scenario, once realized, causes the target damage scenario"
    pairs:
      - {from: threat-scenario, to: [damage-scenario], supports: ["21434:15.4", "21434:15.8"]}

# Links that live inside records rather than as link attributes:
#   test-run.results[].test          test result -> test case
#   test-run.build                   test run -> build record of the integrated software tested
#   build-record.contents            build -> software components and units integrated
#   software-integration-test.step   test case -> integration step of the software-integration plan
#   system-integration-test.step     test case -> integration step of the system-integration plan
#   static-analysis-run.results      verification result -> software unit
#   review-record.subject[].item     review -> reviewed item at a content hash
#   baseline.items[].item            baseline -> item at a content hash
#   communication-record.subject     communication -> baseline or items
#   software-unit.source_files       detailed design -> code
#   software-interface.provided_by   interface -> providing component

# ---------------------------------------------------------------------------
# Coverage rules (each one a deterministic check)
# `subject`: the items checked, in state approved unless stated otherwise.
# `waiver`: what makes a missing link acceptable; a waiver is itself reviewed.
# A rule is active only when at least one process named under `supports` is in
# the scope the project declared; items imported from outside that scope are
# inputs and are not themselves subject to the rules of the process that made them.
# ---------------------------------------------------------------------------
coverage:
  - {id: COV-01, subject: stakeholder-requirement, expect: "assessment accepted or accepted-with-deviation -> at least one system-requirement derived_from it", waiver: "assessment rejected, with agreement", supports: [SYS.2.BP6]}
  - {id: COV-02, subject: system-requirement, expect: "at least one derived_from link", waiver: "origin internal with a Rationale section", supports: [SYS.2.BP6]}
  - {id: COV-03, subject: system-requirement, expect: "at least one system-element or system-interface fulfils it", waiver: "kind constraint with a Rationale section", supports: [SYS.3.BP2, SYS.3.BP6]}
  - {id: COV-04, subject: system-element, expect: "at least one system-requirement allocated to it", waiver: "none", supports: [SYS.3.BP6]}
  - {id: COV-05, subject: system-requirement, expect: "allocated to an element of kind software -> at least one software-requirement derived_from the requirement", waiver: "trace.derive_via_elements in the project configuration: a software-requirement derived_from the element is then enough", supports: [SWE.1.BP6]}
  - {id: COV-06, subject: software-requirement, expect: "at least one derived_from link", waiver: "origin internal with a Rationale section", supports: [SWE.1.BP6]}
  - {id: COV-07, subject: software-requirement, expect: "at least one software-component or software-interface fulfils it", waiver: "kind constraint with a Rationale section", supports: [SWE.2.BP2, SWE.2.BP7]}
  - {id: COV-08, subject: software-component, expect: "at least one software-requirement allocated to it or to a component that is part_of it", waiver: "origin supplied or generated, with the reason for its presence in the Purpose section", supports: [SWE.2.BP7]}
  - {id: COV-09, subject: software-component, expect: "origin developed and kind other than composition -> one component-design refines it and at least one software-unit is part_of it", waiver: "none", supports: [SWE.3.BP5]}
  - {id: COV-10, subject: software-unit, expect: "exactly one part_of link, and every listed source file exists; a unit that lists none is reported as not implemented", waiver: "none", supports: [SWE.3.BP5, SWE.3.BP8]}
  - {id: COV-11, subject: source-file, expect: "every file under the configured source roots is listed by exactly one software-unit", waiver: "path matched by the project's generated or third-party patterns", supports: [SWE.3.BP5]}
  - {id: COV-12, subject: software-unit, expect: "at least one unit-test verifies it, and the latest static-analysis-run has an entry for it", waiver: "origin generated or third-party, with the alternative verification named in the unit verification strategy", supports: [SWE.4.BP5]}
  - {id: COV-13, subject: software-interface, expect: "at least one software-integration-test verifies it", waiver: "none", supports: [SWE.5.BP7]}
  - {id: COV-14, subject: software-requirement, expect: "verification_method test -> at least one software-qualification-test verifies it; otherwise a final review-record covers it", waiver: "none", supports: [SWE.6.BP5]}
  - {id: COV-15, subject: system-interface, expect: "at least one system-integration-test verifies it", waiver: "none", supports: [SYS.4.BP7]}
  - {id: COV-16, subject: system-requirement, expect: "verification_method test -> at least one system-qualification-test verifies it; otherwise a final review-record covers it", waiver: "none", supports: [SYS.5.BP5]}
  - {id: COV-17, subject: test-case, expect: "at least one verifies link, to an item that is not rejected or obsolete", waiver: "none", supports: [SWE.4.BP5, SWE.5.BP7, SWE.6.BP5, SYS.4.BP7, SYS.5.BP5]}
  - {id: COV-18, subject: test-case, expect: "a verdict in the latest final test-run of its level for the baseline under assessment; for an integration test (software or system), in the latest final run on a build of its step; a failed verdict is named by a problem report (affects the case or what it verifies, or found_in the run) until a later run passes it", waiver: "recorded as not-run with a reason accepted in the test summary; a failed verdict stays reported (warning while its problem report is unresolved, information once resolved)", supports: [SWE.4.BP5, SWE.5.BP7, SWE.6.BP5, SYS.4.BP7, SYS.5.BP5]}
  - {id: COV-19, subject: any-engineering-item, expect: "a final review-record with verdict approved covers the current content hash and all its findings are closed", waiver: "none", supports: [SUP.1.BP2, SYS.2.BP7, SYS.3.BP7, SYS.4.BP8, SYS.5.BP6, SWE.1.BP7, SWE.2.BP8, SWE.3.BP6, SWE.4.BP6, SWE.5.BP8, SWE.6.BP6, "21434:9.4", "21434:9.5", "21434:10.4.1", "26262-8:9"]}
  - {id: COV-20, subject: change-request, expect: "from state analysed on: at least one affects link", waiver: "none", supports: [SUP.10.BP8]}
  - {id: COV-21, subject: software-interface, expect: "provided by a component with origin developed -> at least one software-unit of that component realizes it", waiver: "none", supports: [SWE.3.BP2, SWE.3.BP5]}
  - {id: COV-22, subject: software-unit, expect: "every function of category public, scheduled or callback is defined in the listed source files, no function is defined there without a design entry, and wherever the design states types the parameter types and the return type equal those in the code", waiver: "origin generated or third-party", supports: [SWE.3.BP5, SWE.3.BP8]}
  - {id: COV-23, subject: any-engineering-item, expect: "ASIL not lower than that of any item it is derived from or implements; a unit not lower than its component; a component or interface not lower than any requirement allocated to it", waiver: "an approved design-decision that documents the decomposition concerns the item", supports: [SWE.2.BP8, SWE.3.BP6, "26262-9:5", "26262-8:6"]}
  - {id: COV-24, subject: architecture-view, expect: "at least one shows link, and every shown item exists and is not rejected or obsolete", waiver: "none", supports: [SWE.2.BP4, SYS.3.BP4]}
  - {id: COV-25, subject: project, expect: "at software level one approved architecture-view exists for each of the kinds structure, execution-model and resource-summary, and at least one of kind state-machine or sequence", waiver: "a kind declared not applicable in the project configuration, with the reason", supports: [SWE.2.BP1, SWE.2.BP4, SWE.2.BP5]}
  - {id: COV-27, subject: project, expect: "for every process in scope, an approved plan exists of each kind that plan_kinds maps to one of its base practices", waiver: "none", supports: [SWE.4.BP1, SWE.5.BP1, SWE.5.BP2, SWE.6.BP1, SYS.4.BP1, SYS.4.BP2, SYS.5.BP1, SUP.1.BP1, SUP.8.BP1, SUP.9.BP1, SUP.10.BP1]}
  - {id: COV-28, subject: software-unit, expect: "the latest final unit test run reports structural coverage of the unit that reaches the targets the approved unit-verification plan sets for the unit's ASIL", waiver: "origin generated or third-party; or a deviation recorded with the coverage entry", supports: [SWE.4.BP2, SWE.4.BP4]}
  - {id: COV-29, subject: software-unit, expect: "every designed function of category public, scheduled or callback is named by at least one unit test (verifies <unit>#<function>)", waiver: "origin generated or third-party", supports: [SWE.4.BP2, SWE.4.BP5]}
  - {id: COV-30, subject: software-unit, expect: "the unit's source files and the test files of its test cases are unchanged since the latest final unit test run and the latest final static analysis run recorded them", waiver: "none", supports: [SWE.4.BP3, SWE.4.BP4]}
  - {id: COV-31, subject: work-package, expect: "part of at most one work package; part_of and depends_on links form no cycle", waiver: "none", supports: [MAN.3.BP4, MAN.3.BP8]}
  - {id: COV-32, subject: any-engineering-item, expect: "every live engineering item of a process in scope, other than imported items and work packages, is delivered by a live work package", waiver: "none", supports: [MAN.3.BP4, MAN.3.BP9]}
  - {id: COV-33, subject: project, expect: "live work packages exist for engineering, for management and for support work", waiver: "none", supports: [MAN.3.BP4]}
  - {id: COV-34, subject: work-package, expect: "planned finish not before planned start, not after the finish of the package it is part of, and not before the finish of a package it depends on plus nothing; activities finish within the package", waiver: "none", supports: [MAN.3.BP8, MAN.3.BP9]}
  - {id: COV-35, subject: project, expect: "the approved software-integration plan integrates every live software component other than a composition in exactly one step, or names it as a double of its last step; every component a step names exists and is live, and step names are unique", waiver: "none", supports: [SWE.5.BP1]}
  - {id: COV-36, subject: project, expect: "for every step of the approved software-integration plan, the latest final build record of that step succeeded, contains every component integrated up to that step - a developed component with each of its live units that has code - and recorded every file it built as it is now", waiver: "none; while no unit of the step has code the finding is pending", supports: [SWE.5.BP4]}
  - {id: COV-37, subject: software-integration-test, expect: "names a step of the approved software-integration plan; every step of that plan has at least one live software-integration-test", waiver: "none", supports: [SWE.5.BP3, SWE.5.BP5]}
  - {id: COV-38, subject: test-run, expect: "the latest final run of level software-integration of each step, and the latest final run of level software-qualification, name the latest final successful build of that step (for qualification: of the last step), made from the item under test of the run", waiver: "software-qualification: no approved software-integration plan exists, because the integrated software comes from outside the scope", supports: [SWE.5.BP6, SWE.6.BP4]}
  - {id: COV-39, subject: problem-report, expect: "a live problem report of a severity that the approved problem-resolution plan names under urgent_severities records an urgent_action with who authorised it and when", waiver: "none; an action of 'none' with its reason is a decision too", supports: [SUP.9.BP5]}
  - {id: COV-40, subject: problem-report, expect: "a live problem report of a severity that the approved problem-resolution plan names under alerts is the subject of a final communication record whose audience names every party the alert rule lists", waiver: "none", supports: [SUP.9.BP6]}
  - {id: COV-41, subject: problem-report, expect: "from state in-resolution on: if it affects an item listed by a final baseline whose purpose is not internal, a change request resolves it", waiver: "none", supports: [SUP.9.BP7, SUP.10.BP2]}
  - {id: COV-42, subject: problem-report, expect: "in state closed: the closure names who accepted it, when, and evidence that is a final test run or review record; every change request that resolves it is closed", waiver: "none", supports: [SUP.9.BP8]}
  - {id: COV-43, subject: baseline, expect: "for every final baseline whose purpose a quality check of the approved quality-assurance plan names under before, a final quality record of that check was made on or before the day the baseline was created", waiver: "none", supports: [SUP.1.BP2, SUP.1.BP3]}
  - {id: COV-44, subject: quality-record, expect: "every finding of a final quality record names, under action, an existing corrective action or problem report", waiver: "none", supports: [SUP.1.BP5]}
  - {id: COV-45, subject: quality-record, expect: "a final quality record of kind summary is the subject of a final communication record", waiver: "none", supports: [SUP.1.BP4]}
  - {id: COV-46, subject: project, expect: "the approved system-integration plan integrates every live system element that is not external in exactly one step, or names it as a double of its last step; every element a step names exists and is live, and step names are unique", waiver: "none", supports: [SYS.4.BP1]}
  - {id: COV-47, subject: project, expect: "for every step of the approved system-integration plan, the latest final build record of level system of that step succeeded and contains every element integrated up to that step; a software build it names is final, succeeded and the latest of the last software integration step", waiver: "none", supports: [SYS.4.BP4]}
  - {id: COV-48, subject: system-integration-test, expect: "names a step of the approved system-integration plan; every step of that plan has at least one live system-integration-test", waiver: "none", supports: [SYS.4.BP3, SYS.4.BP5]}
  - {id: COV-49, subject: test-run, expect: "the latest final run of level system-integration of each step, and the latest final run of level system-qualification, name the latest final successful system build of that step (for qualification: of the last step), made from the item under test of the run", waiver: "system-qualification: no approved system-integration plan exists, because the integrated system comes from outside the scope", supports: [SYS.4.BP6, SYS.5.BP4]}
  - {id: COV-50, subject: risk, expect: "from state analysed on: probability and impact lie within the scales of the approved risk-management plan, and the category is one the plan names", waiver: "none", supports: [MAN.5.BP4, MAN.5.BP1]}
  - {id: COV-51, subject: risk, expect: "a live risk whose exposure (probability times impact) is above acceptable_up_to of the plan is in treatment, closed, or accepted with a decision that names who accepted it", waiver: "none", supports: [MAN.5.BP5]}
  - {id: COV-52, subject: risk, expect: "a risk in treatment has at least one indicator with a threshold", waiver: "none", supports: [MAN.5.BP6]}
  - {id: COV-53, subject: project, expect: "the approved cybersecurity plan has an entry in cybersecurity_activities for every subclause of the clauses under scope.cybersecurity, each with a decision of performed, tailored, not-applicable, by-customer or by-supplier; tailored and not-applicable carry a rationale", waiver: "none", supports: ["21434:6.4.2", "21434:6.4.3"]}
  - {id: COV-54, subject: asset, expect: "at least one threat-scenario threatens it; for a damage-scenario: at least one threat-scenario leads_to it", waiver: "none", supports: ["21434:15.3", "21434:15.4"]}
  - {id: COV-55, subject: damage-scenario, expect: "from state in-review on: an impact rating severe, major, moderate or negligible for every impact category of the approved cybersecurity plan, and none for a category it does not name", waiver: "none", supports: ["21434:15.5"]}
  - {id: COV-56, subject: threat-scenario, expect: "threatens at least one asset and leads_to at least one damage-scenario; its property is one of the asset's properties; from in-review on: at least one attack path, each rated, and feasibility the highest of them", waiver: "none", supports: ["21434:15.4", "21434:15.6", "21434:15.7"]}
  - {id: COV-57, subject: threat-scenario, expect: "from in-review on: risk_value equals the risk_matrix of the approved cybersecurity plan for the highest impact of the damage scenarios it leads to and its feasibility", waiver: "none", supports: ["21434:15.8"]}
  - {id: COV-58, subject: threat-scenario, expect: "from in-review on: a treatment of avoid, reduce, share or retain; reduce -> a cybersecurity-goal addresses it; share or retain -> a cybersecurity-claim addresses it; retain above retain_up_to of the plan -> a decision naming who accepted it", waiver: "none", supports: ["21434:15.9", "21434:9.4"]}
  - {id: COV-59, subject: cybersecurity-goal, expect: "at least one system-requirement or software-requirement derived_from it; also for a goal received from the customer", waiver: "none", supports: ["21434:9.5", "21434:10.4.1"]}
  - {id: COV-60, subject: any-engineering-item, expect: "derived from a cybersecurity goal or a security-relevant requirement, or fulfilling a security-relevant requirement -> security_relevant true", waiver: "none", supports: ["21434:9.5", "21434:10.4.1"]}
  - {id: COV-61, subject: weakness, expect: "from state analysed on: vulnerability decided; a vulnerability has a risk value and a treatment; reduce -> from in-resolution on a change-request resolves it; share or retain -> a cybersecurity-claim addresses it", waiver: "none", supports: ["21434:8.5", "21434:8.6"]}
  - {id: COV-62, subject: cybersecurity-goal, expect: "at least one system-qualification-test verifies it", waiver: "none; where the customer validates on the vehicle, clause 11 is not under scope.cybersecurity", supports: ["21434:11"]}
  - {id: COV-63, subject: project, expect: "the approved safety plan has an entry in safety_activities for every clause of the parts under scope.safety, each with a decision of performed, tailored, not-applicable, by-customer, by-supplier or by-organization; tailored and not-applicable carry a rationale", waiver: "none", supports: ["26262-2:6"]}
  - {id: COV-64, subject: project, expect: "the approved safety plan has an entry in method_selection for every table of parts 4, 5, 6 and 8 under scope.safety; applied entries name the methods or where they are applied, not-applicable entries carry a rationale", waiver: "none", supports: ["26262-2:6", "26262-4:5", "26262-5:5", "26262-6:5", "26262-8:9"]}
  - {id: COV-65, subject: hazardous-event, expect: "from in-review on: its ASIL is the one the asil_determination of the approved safety plan gives for its severity, exposure and controllability", waiver: "none; without an asil_determination the ASILs are not assessed (warning)", supports: ["26262-3:6"]}
  - {id: COV-66, subject: hazardous-event, expect: "ASIL A to D -> at least one safety-goal addresses it, with an ASIL not lower than the event's", waiver: "none", supports: ["26262-3:6"]}
  - {id: COV-67, subject: safety-goal, expect: "at least one system-requirement or software-requirement derived_from it; also for a goal received from the customer", waiver: "none", supports: ["26262-3:7", "26262-4:6", "26262-6:6"]}
  - {id: COV-68, subject: safety-analysis, expect: "from in-review on: every finding is open or closed; a closed one names an existing item under carried_by or gives a rationale; an approved analysis has no open finding", waiver: "none", supports: ["26262-9:8", "26262-9:7", "26262-6:7", "26262-4:6"]}
  - {id: COV-69, subject: project, expect: "every software component (not a composition) with ASIL A to D is analysed by a software-level safety-analysis; every system element with ASIL A to D by a system-level one; where software components of different ASILs coexist, a dependent failures analysis (method dfa) exists at software level", waiver: "none", supports: ["26262-6:7", "26262-4:6", "26262-9:6", "26262-9:7"]}
  - {id: COV-70, subject: design-decision, expect: "a decomposition names an existing requirement, the requirements it is decomposed into, and a live safety-analysis of method dfa under independence; no part has an ASIL above the decomposed requirement", waiver: "none", supports: ["26262-9:5"]}
  - {id: COV-71, subject: tool-evaluation, expect: "from in-review on: TCL2 and TCL3 name a qualification method and its evidence; the confidence level is the one the tcl_determination of the approved safety plan gives, where the plan states one", waiver: "none", supports: ["26262-8:11"]}
  - {id: COV-72, subject: project, expect: "every tool named in a final build-record or static-analysis-run is covered by a live tool-evaluation", waiver: "none", supports: ["26262-8:11"]}
  - {id: COV-73, subject: project, expect: "for every entry of confirmation_measures of the approved safety plan, a final confirmation-measure record of that kind and subject exists with at least the independence planned and a result other than failed or rejected", waiver: "none", supports: ["26262-2:6"]}
  - {id: COV-74, subject: release, expect: "its baseline is final and not internal; a final communication-record names the release as delivered, with the receipt stated under agreement", waiver: "none", supports: [SPL.2.BP13, SPL.2.BP11, "21434:6.4.9", "26262-2:6"]}
  - {id: COV-75, subject: software-component, expect: "origin supplied or reused, ASIL A to D -> an approved component-qualification of result qualified or qualified-with-restrictions qualifies it", waiver: "the safety plan decides clause 8:12 not-applicable or by-customer, with the rationale (for example developed under ISO 26262 by the party of the interface agreement)", supports: ["26262-8:12"]}
  - {id: COV-76, subject: supplier-agreement, expect: "an approved supplier-evaluation with result selected or selected-with-conditions names the same supplier", waiver: "none", supports: ["21434:7.4.1", "26262-8:5"]}
  - {id: COV-26, subject: baseline, expect: "at least one final communication-record names the baseline as subject", waiver: "baseline purpose marked internal in the project configuration", supports: [SYS.2.BP8, SYS.3.BP8, SYS.4.BP9, SYS.5.BP7, SWE.1.BP8, SWE.2.BP9, SWE.3.BP7, SWE.4.BP7, SWE.5.BP9, SWE.6.BP7]}

# ---------------------------------------------------------------------------
# Derived facts (computed by the trace engine, never stored on the item)
# ---------------------------------------------------------------------------
derived:
  upstream-not-approved: "status approved, while an item it links to is still in draft or in review (reported as UPSTREAM)"
  open-query: "an open query is about an approved item (reported as QUERY)"
  stale-approval: "status approved, but no final approving review record matches the current content hash"
  suspect-link: "the target's current content hash differs from the one recorded under references in the review that approved the linking item"
  implemented: "requirement: every component it is allocated to has approved units whose source files exist in the item under test"
  verified: "requirement: every test case that verifies it passed in the latest final test run of the item under test, or its non-test verification record is final"
  orphan: "item with no upstream link and no waiver"
  in-baseline: "the item, at its current content hash, is listed by a final baseline"
