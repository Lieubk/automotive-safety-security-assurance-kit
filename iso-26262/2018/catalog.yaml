# ISO 26262:2018 Road vehicles - Functional safety: catalog of parts, clauses,
# requirement numbers, work products and table titles.
#
# Identifiers and official titles only. The purpose of each clause is in our own words;
# the text of the standard, its tables and their content are not reproduced. Where a
# table of the standard decides something - ASIL determination, methods per ASIL,
# independence of confirmation measures, tool confidence level - the project states
# in its safety plan what it applies; read the standard for the content.
#
# A project declares the parts it is responsible for under `scope.safety` in
# project.yaml. The schema refers to a clause as "26262-<part>:<clause>", for example
# "26262-6:7", and to a work product as "26262-<part>:<clause>.5.<n>".

standard: ISO 26262
edition: "2018"
title: Road vehicles - Functional safety
parts:
  - id: "1"
    name: "Vocabulary"
    level: vocabulary
    clauses: []
    tables: []
  - id: "2"
    name: "Management of functional safety"
    level: management
    clauses:
      - id: "5"
        name: "Overall safety management"
        purpose: "The organization keeps rules and processes for functional safety, a safety culture, competence and quality management, and handles safety anomalies; projects build on them."
