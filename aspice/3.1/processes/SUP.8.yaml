id: SUP.8
name: Configuration Management
group: SUP
scope: vda
purpose: >-
  Protect the integrity of everything a process or project produces and get
  the right versions to the parties who need them.
outcomes:
  - n: 1
    text: A configuration management strategy exists.
  - n: 2
    text: Every configuration item produced by a process or project is identified, defined and baselined as the strategy prescribes.
  - n: 3
    text: Changes to configuration items and their releases are under control.
  - n: 4
    text: Changes and releases reach the parties who need them.
  - n: 5
    text: The status of configuration items and of changes to them is recorded and reported.
  - n: 6
    text: Baselines are complete and consistent.
  - n: 7
    text: Storage of configuration items is under control.
base_practices:
  - id: SUP.8.BP1
    name: Develop a configuration management strategy
    intent: A strategy covers responsibilities, tools and repositories, access rights, naming, criteria for configuration items and for baselines, branching and merging, and how revision history is kept.
    outcomes: [1]
    evidence:
      - Configuration management plan covering these topics
      - Variant handling concept
    rule_ids: [SAP.RL.1, SAP.RL.2, SAP.RL.3, SAP.RL.4, SUP.8.RL.1, SUP.8.RL.2, SUP.8.RL.3, SUP.8.RL.4, SUP.8.RL.5, SUP.8.RC.1]
  - id: SUP.8.BP2
    name: Identify configuration items
    intent: Configuration items are identified and documented as the strategy defines.
    outcomes: [2]
    evidence:
      - Configuration item list
      - Repository structure that matches the list
    rule_ids: [APA.RL.4, SUP.8.RL.14, CL2.RC.13]
  - id: SUP.8.BP3
    name: Establish a configuration management system
    intent: A configuration management system that implements the strategy is in place.
    outcomes: [1, 2, 3, 4, 6, 7]
    evidence:
      - Configured repositories and tools with access control settings
      - Evidence that the system is used for all configuration items
    rule_ids: [SUP.8.RL.11, SUP.8.RL.12, SUP.8.RL.13, SUP.8.RL.14, CL2.RC.15]
  - id: SUP.8.BP4
    name: Establish branch management
    intent: Where development runs in parallel from a common base, branching is managed as the strategy defines.
    outcomes: [1, 3, 4, 6, 7]
    evidence:
      - Branch model description
      - Branch and merge history that conforms to it, with merge verification evidence
    rule_ids: [SUP.8.RL.9, SUP.8.RL.10, SUP.8.RL.14]
  - id: SUP.8.BP5
    name: Control modifications and releases
    intent: Control mechanisms defined by the strategy exist and are used to govern changes to configuration items and their release.
    outcomes: [3, 4, 5]
    evidence:
      - Check-in history linked to change requests
      - Protected branches and release tags with approval
    rule_ids: [SUP.8.RL.14, SUP.8.RC.3, CL2.RC.15]
  - id: SUP.8.BP6
    name: Establish baselines
    intent: Baselines for internal use and for delivery outside the project are created as the strategy defines.
    outcomes: [2]
    evidence:
      - Baseline tags or labels with content lists
      - Baseline records
    rule_ids: [SUP.8.RL.6, SUP.8.RL.7, SUP.8.RL.8, SUP.8.RC.2, SUP.8.RL.14, CL2.RC.15]
  - id: SUP.8.BP7
    name: Report configuration status
    intent: The status of configuration items is recorded and reported so that project management and other processes can rely on it.
    outcomes: [5]
    evidence:
      - Configuration status reports
    rule_ids: [SUP.8.RC.3]
  - id: SUP.8.BP8
    name: Verify the information about configured items
    intent: It is verified that the information held on configured items and baselines is complete, and that baselines are consistent.
    outcomes: [6]
    evidence:
      - Baseline audit records
      - Configuration audit records
    rule_ids: [SUP.8.RL.6, SUP.8.RL.7, SUP.8.RL.8, SUP.8.RC.2, SUP.8.RL.9, SUP.8.RL.10, SUP.8.RC.3, SUP.8.RC.4, CL2.RC.18]
  - id: SUP.8.BP9
    name: Manage the storage of configuration items and baselines
    intent: Storage, long-term archiving and backup of the configuration management systems are scheduled and resourced so that items and baselines stay intact and available.
    outcomes: [4, 5, 6, 7]
    evidence:
      - Backup and archiving concept
      - Backup logs and restore test records
    rule_ids: [SUP.8.RL.11, SUP.8.RL.12, SUP.8.RL.13, SUP.8.RC.3, SUP.8.RC.5, SUP.8.RC.6]
output_work_products:
  - id: "06-02"
    name: Handling and storage guide
    outcomes: [3, 4, 5, 7]
  - id: "08-04"
    name: Configuration management plan
    outcomes: [1, 2, 7]
  - id: "08-14"
    name: Recovery plan
    outcomes: [1, 7]
  - id: "13-08"
    name: Baseline
    outcomes: [2, 3, 4, 5, 6]
  - id: "13-10"
    name: Configuration management record
    outcomes: [2, 5, 7]
  - id: "14-01"
    name: Change history
    outcomes: [3]
  - id: "16-03"
    name: Configuration management system
    outcomes: [1, 3, 4]
