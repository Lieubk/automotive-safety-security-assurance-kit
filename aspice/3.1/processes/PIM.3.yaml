id: PIM.3
name: Process Improvement
group: PIM
scope: other
purpose: Keep raising the organisation's effectiveness and efficiency through processes that match business needs.
outcomes:
- n: 1
  text: Resources are committed to sustain improvement actions.
- n: 2
  text: Problems arising from inside or outside the organisation are named as improvement opportunities, with reasons
    for change.
- n: 3
  text: The present state of the processes that prompted improvement is analysed.
- n: 4
  text: Improvement goals are set and ranked, and the resulting process changes are defined, planned and put in
    place.
- n: 5
  text: The effects of the changed processes are watched, measured and checked against the goals.
- n: 6
  text: What was learned is shared across the organisation.
- n: 7
  text: Results of improvements are assessed and reuse elsewhere in the organisation is considered.
base_practices:
- id: PIM.3.BP1
  name: Establish commitment
  intent: Management supports the process group and provides resources and enablers such as training, methods and
    infrastructure to sustain improvement.
  outcomes:
  - 1
  evidence:
  - Commitment statement
  - Resource allocation
  rule_ids: []
- id: PIM.3.BP2
  name: Identify issues
  intent: Continuously analyse processes and interfaces, including customer input, to find issues that justify change.
  outcomes:
  - 2
  - 3
  evidence:
  - Improvement opportunities
  - Change requests
  rule_ids: []
- id: PIM.3.BP3
  name: Establish process improvement goals
  intent: Analyse the current state of the processes behind the improvement stimuli and set improvement goals.
  outcomes:
  - 3
  evidence:
  - Goals
  - Assessment or audit report
  rule_ids: []
- id: PIM.3.BP4
  name: Prioritize improvements
  intent: Rank the improvement goals and activities.
  outcomes:
  - 4
  evidence:
  - Prioritised improvement list
  rule_ids: []
- id: PIM.3.BP5
  name: Plan process changes
  intent: Define and plan the process changes that follow from the goals.
  outcomes:
  - 4
  evidence:
  - Improvement plan
  rule_ids: []
- id: PIM.3.BP6
  name: Implement process changes
  intent: Put the improved processes in place, update process descriptions and train people.
  outcomes:
  - 4
  evidence:
  - Updated process descriptions
  - Training material
  rule_ids: []
- id: PIM.3.BP7
  name: Confirm process improvement
  intent: Monitor and measure the effects of the new processes and confirm them against the goals.
  outcomes:
  - 5
  evidence:
  - Process measures
  - Evaluation report
  rule_ids: []
- id: PIM.3.BP8
  name: Communicate results of improvement
  intent: Share what was learned and the progress made beyond the improvement project, including with the customer
    where fitting.
  outcomes:
  - 6
  evidence:
  - Communication records
  rule_ids: []
- id: PIM.3.BP9
  name: Evaluate the results of the improvement project
  intent: Judge whether the solution worked and could be used elsewhere in the organisation.
  outcomes:
  - 7
  evidence:
  - Evaluation report
  rule_ids: []
