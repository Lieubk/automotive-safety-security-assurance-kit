id: SYS.2
name: System Requirements Analysis
group: SYS
scope: vda
purpose: >-
  Convert the agreed stakeholder requirements into a structured, analysed and verifiable set of
  system requirements that system design can work from.
outcomes:
  - n: 1
    text: The system requirements exist as a defined set.
  - n: 2
    text: The system requirements are categorised and have been examined for correctness and verifiability.
  - n: 3
    text: The effect of the system requirements on the operating environment has been analysed.
  - n: 4
    text: Priorities for implementing the system requirements are set.
  - n: 5
    text: The system requirements are revised whenever that becomes necessary.
  - n: 6
    text: Stakeholder requirements and system requirements agree in content and are linked in both directions.
  - n: 7
    text: The consequences of the system requirements for cost, schedule and the technical solution have been evaluated.
  - n: 8
    text: Agreement on the system requirements has been reached and every affected party has been informed of them.
base_practices:
  - id: SYS.2.BP1
    name: Specify system requirements
    intent: Derive the functions and capabilities the system needs from the stakeholder requirements and their changes, and record them as functional and non-functional items in a system requirements specification.
    outcomes: [1, 5, 7]
    evidence:
      - Specification with uniquely identified functional and non-functional requirements
      - Application parameters that shape behaviour captured as requirements
      - Change history showing updates that follow stakeholder changes
    rule_ids: [APA.RL.1, APA.RL.3, SYS.2.RL.1, SYS.2.RL.2, SYS.2.RL.3, SYS.2.RC.5]
  - id: SYS.2.BP2
    name: Structure system requirements
    intent: Organise the specification so it serves the project, for example by clustering, ordering, categorising and ranking the requirements by stakeholder need.
    outcomes: [2, 4]
    evidence:
      - Category, priority and target-release attributes on each requirement
      - Chapter or cluster structure of the specification
      - Mapping of requirement content to planned releases
    rule_ids: [SYS.2.RL.4, SYS.2.RL.5, SYS.2.RC.1, SYS.2.RL.9]
  - id: SYS.2.BP3
    name: Analyze system requirements
    intent: Examine the requirements and their mutual dependencies for correctness, feasibility and verifiability, feed risk identification, and state the consequences for cost, schedule and the technical solution.
    outcomes: [1, 2, 7]
    evidence:
      - Analysis result per requirement or cluster covering feasibility, verifiability and risk
      - Review record of the analysis
      - Effort and schedule inputs handed over to project estimation
    rule_ids: [AGE.RC.3, SYS.2.RL.6, SYS.2.RC.2, SYS.2.RL.9]
  - id: SYS.2.BP4
    name: Analyze the impact on the operating environment
    intent: Identify the interfaces between the system and its neighbours and work out what the system requirements mean for those interfaces and for the environment.
    outcomes: [3, 7]
    evidence:
      - System context or boundary description
      - Interface requirements towards neighbouring elements
      - Documented impact analysis per neighbouring element
    rule_ids: [SYS.2.RC.3, SYS.2.RC.4, SYS.2.RL.9]
  - id: SYS.2.BP5
    name: Develop verification criteria
    intent: Give every system requirement verification criteria that state in qualitative and quantitative terms how its fulfilment will be checked.
    outcomes: [2, 7]
    evidence:
      - Verification-criteria attribute or linked item per requirement with method and pass condition
      - System test cases that visibly build on those criteria
    rule_ids: [VEC.RL.1, VEC.RL.2, SYS.2.RL.7, SYS.2.RL.9]
  - id: SYS.2.BP6
    name: Establish bidirectional traceability
    intent: Link stakeholder requirements and system requirements so the relation can be followed from either side.
    outcomes: [6]
    evidence:
      - Link data or trace matrix between the two requirement levels
      - Coverage figures in both directions
      - List of unlinked items with justification
    rule_ids: [TAC.RC.1, TAC.RC.2, TAC.RC.3, TAC.RC.4, TAC.RL.2, TAC.RL.3, SYS.2.RL.9, SYS.2.RC.8]
  - id: SYS.2.BP7
    name: Ensure consistency
    intent: Check the content of the system requirements against the stakeholder requirements they come from, so nothing contradicts, is lost or is added without reason.
    outcomes: [6]
    evidence:
      - Review record covering the content of linked requirement pairs
      - Findings and their closure
    rule_ids: [TAC.RL.1, TAC.RL.2, TAC.RL.3, TAC.RC.4, SYS.2.RL.8, SYS.2.RL.9, SYS.2.RC.9, CL2.RC.18]
  - id: SYS.2.BP8
    name: Communicate agreed system requirements
    intent: Make sure the agreed requirement set and each later update reaches all parties who need it.
    outcomes: [8]
    evidence:
      - Release note or notification per baseline
      - Distribution list of affected parties
      - Acknowledgement from the receiving disciplines
    rule_ids: [SAC.RL.1, SAC.RC.4, SAC.RC.5, SAC.RC.6, SYS.2.RL.9, CL2.RC.9]
