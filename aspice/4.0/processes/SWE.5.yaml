# Automotive SPICE 4.0 - built from the DRAFT 3.991 (yellow-band release of 2023-06-06), which says it is
# not for assessments. Identifiers and official names only; purpose, outcomes, intents and evidence
# are paraphrases. `maps_to` names the 3.1 base practices whose evidence structures in
# schema/items.yaml carry this practice; an empty list means the toolkit holds nothing for it.

id: SWE.5
name: Software Component Verification and Integration Verification
group: SWE
scope: vda
purpose: Verify software components against the architecture, and integrate software elements and verify the integrated
  result against architecture and detailed design.
outcomes:
- n: 1
  text: Measures for integration verification are defined from architecture and detailed design, including interfaces
    and interactions.
- n: 2
  text: Measures for verifying component behaviour and interfaces are defined.
- n: 3
  text: Software elements are integrated into a complete software.
- n: 4
  text: Measures are chosen for the release scope, with regression in mind.
- n: 5
  text: Components are verified with the chosen measures and the results recorded.
- n: 6
  text: The integrated elements are verified with the chosen measures and the results recorded.
- n: 7
  text: Measures and design, and results and measures, are consistent and linked in both directions.
- n: 8
  text: Component and integration results are summarised and shared with all concerned.
base_practices:
- id: SWE.5.BP1
  name: Specify software integration verification measures
  intent: Define integration measures with order, preconditions, techniques, criteria and environment, based on
    static and dynamic architecture.
  outcomes:
  - 1
  evidence:
  - Integration verification measures
  rule_ids: []
  maps_to:
  - SWE.5.BP2
  - SWE.5.BP3
- id: SWE.5.BP2
  name: Specify verification measures for verifying software component behavior
  intent: Define measures that show a component keeps to the behaviour and interfaces set in the architecture; unit-level
    checks belong to SWE.4.
  outcomes:
  - 2
  evidence:
  - Component verification measures
  rule_ids: []
  maps_to:
  - SWE.5.BP3
- id: SWE.5.BP3
  name: Select verification measures
  intent: Record which measures apply at each integration step, with regression criteria and enough coverage for
    the release scope.
  outcomes:
  - 4
  evidence:
  - Selection of measures per integration step
  rule_ids: []
  maps_to:
  - SWE.5.BP5
- id: SWE.5.BP4
  name: Integrate software elements and perform integration verification
  intent: Build the software up in the planned order, run the chosen integration measures and record outcomes with
    pass/fail data.
  outcomes:
  - 3
  - 6
  evidence:
  - Integrated software and integration results
  rule_ids: []
  maps_to:
  - SWE.5.BP1
  - SWE.5.BP4
  - SWE.5.BP6
- id: SWE.5.BP5
  name: Perform software component verification
  intent: Run the chosen component measures and record outcomes with pass/fail data.
  outcomes:
  - 5
  evidence:
  - Component verification results
  rule_ids: []
  maps_to:
  - SWE.5.BP6
- id: SWE.5.BP6
  name: Ensure consistency and establish bidirectional traceability
  intent: Link measures to architecture and detailed design and results to measures, and keep them consistent.
  outcomes:
  - 7
  evidence:
  - Traceability and consistency results
  rule_ids: []
  maps_to:
  - SWE.5.BP7
  - SWE.5.BP8
- id: SWE.5.BP7
  name: Summarize and communicate results
  intent: Condense component and integration results into a summary and pass it on.
  outcomes:
  - 8
  evidence:
  - Summary of results
  rule_ids: []
  maps_to:
  - SWE.5.BP9
output_work_products:
- id: 08-60
  name: Verification Measure
  outcomes:
  - 1
  - 2
- id: 06-50
  name: Integration Sequence Instruction
  outcomes:
  - 3
- id: 08-58
  name: Verification Measure Selection Set
  outcomes:
  - 4
- id: 15-52
  name: Verification Results
  outcomes:
  - 5
  - 6
- id: 13-51
  name: Consistency Evidence
  outcomes:
  - 7
- id: 13-52
  name: Communication Evidence
  outcomes:
  - 8
- id: 01-03
  name: Software Component
  outcomes:
  - 2
  - 5
- id: 01-50
  name: Integrated Software
  outcomes:
  - 3
  - 6
