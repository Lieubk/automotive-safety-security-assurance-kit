# Automotive SPICE 4.0 - built from the DRAFT 3.991 (yellow-band release of 2023-06-06), which says it is
# not for assessments. Identifiers and official names only; purpose, outcomes, intents and evidence
# are paraphrases. `maps_to` names the 3.1 base practices whose evidence structures in
# schema/items.yaml carry this practice; an empty list means the toolkit holds nothing for it.

id: SWE.6
name: Software Verification
group: SWE
scope: vda
purpose: Make sure the integrated software has been verified against the software requirements.
outcomes:
- n: 1
  text: Verification measures for the software are defined from the software requirements.
- n: 2
  text: Measures are chosen for the release scope, with regression in mind.
- n: 3
  text: The integrated software is verified with the chosen measures and the results recorded.
- n: 4
  text: Measures and requirements, and results and measures, are consistent and linked in both directions.
- n: 5
  text: Results are summarised and shared with all concerned.
base_practices:
- id: SWE.6.BP1
  name: Specify verification measures for software verification
  intent: Define measures that show compliance with functional and non-functional requirements, with techniques
    fitting each requirement, criteria, sequence and environment.
  outcomes:
  - 1
  evidence:
  - Software verification measures
  rule_ids: []
  maps_to:
  - SWE.6.BP1
  - SWE.6.BP2
- id: SWE.6.BP2
  name: Select verification measures
  intent: Record the choice of measures with regression criteria and sufficient coverage of the release scope.
  outcomes:
  - 2
  evidence:
  - Selection of verification measures
  rule_ids: []
  maps_to:
  - SWE.6.BP3
- id: SWE.6.BP3
  name: Verify the integrated software
  intent: Run the chosen measures on the integrated software and record outcomes with pass/fail data.
  outcomes:
  - 3
  evidence:
  - Verification results
  rule_ids: []
  maps_to:
  - SWE.6.BP4
- id: SWE.6.BP4
  name: Ensure consistency and establish bidirectional traceability
  intent: Link measures to requirements and results to measures, and keep them consistent.
  outcomes:
  - 4
  evidence:
  - Traceability and consistency results
  rule_ids: []
  maps_to:
  - SWE.6.BP5
  - SWE.6.BP6
- id: SWE.6.BP5
  name: Summarize and communicate results
  intent: Condense the results into a summary and pass it on.
  outcomes:
  - 5
  evidence:
  - Summary of verification results
  rule_ids: []
  maps_to:
  - SWE.6.BP7
output_work_products:
- id: 08-60
  name: Verification Measure
  outcomes:
  - 1
- id: 08-58
  name: Verification Measure Selection Set
  outcomes:
  - 2
- id: 15-52
  name: Verification Results
  outcomes:
  - 3
  - 4
- id: 13-51
  name: Consistency Evidence
  outcomes:
  - 4
- id: 13-52
  name: Communication Evidence
  outcomes:
  - 5
