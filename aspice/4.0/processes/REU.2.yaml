# Automotive SPICE 4.0 - built from the DRAFT 3.991 (yellow-band release of 2023-06-06), which says it is
# not for assessments. Identifiers and official names only; purpose, outcomes, intents and evidence
# are paraphrases. `maps_to` names the 3.1 base practices whose evidence structures in
# schema/items.yaml carry this practice; an empty list means the toolkit holds nothing for it.

id: REU.2
name: Management of Products for Reuse
group: REU
scope: other
purpose: Make sure that products taken over for reuse are analysed, verified and approved for the context in which
  they will be used.
outcomes:
- n: 1
  text: Products for reuse are chosen by defined criteria.
- n: 2
  text: Products for reuse are analysed for portability and interoperability.
- n: 3
  text: Limits on reuse are defined and made known.
- n: 4
  text: Products for reuse are verified.
- n: 5
  text: Products for reuse are made available to those affected.
- n: 6
  text: A way of communicating with the provider of the reused product is established.
base_practices:
- id: REU.2.BP1
  name: Select products for reuse
  intent: Choose the products to reuse by defined criteria; they may be systems, hardware, software, third-party
    or legacy components.
  outcomes:
  - 1
  evidence:
  - Reuse candidates with selection criteria
  rule_ids: []
  maps_to: []
- id: REU.2.BP2
  name: Analyze the reuse capability of the product
  intent: Compare the target architecture with the product to see whether it fits, for example regarding requirements,
    verifiability and portability.
  outcomes:
  - 2
  evidence:
  - Reuse analysis evidence
  rule_ids: []
  maps_to: []
- id: REU.2.BP3
  name: Define limitations for reuse
  intent: Define the limits that apply to the product and tell those concerned.
  outcomes:
  - 3
  evidence:
  - Statement of limitations
  rule_ids: []
  maps_to: []
- id: REU.2.BP4
  name: Ensure qualification of products for reuse
  intent: Provide evidence, for instance verification evidence, that the product suits the intended use.
  outcomes:
  - 4
  evidence:
  - Qualification evidence
  rule_ids: []
  maps_to: []
- id: REU.2.BP5
  name: Provide products for reuse
  intent: Make the product available to those who need it.
  outcomes:
  - 5
  evidence:
  - Handover or availability record
  rule_ids: []
  maps_to: []
- id: REU.2.BP6
  name: Communicate information about effectiveness of reuse activities
  intent: Set up a way to send experience and technical results back to the provider of the reused product.
  outcomes:
  - 6
  evidence:
  - Communication evidence with the provider
  rule_ids: []
  maps_to: []
output_work_products:
- id: 04-02
  name: Domain architecture
  outcomes:
  - 2
- id: 12-03
  name: Reuse candidate
  outcomes:
  - 1
- id: 13-52
  name: Communication evidence
  outcomes:
  - 5
  - 6
- id: 15-07
  name: Reuse analysis evidence
  outcomes:
  - 2
  - 3
- id: 13-53
  name: Qualification evidence
  outcomes:
  - 4
catalog_only: true
