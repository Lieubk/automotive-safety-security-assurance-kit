- id: 13-10
  name: Configuration management record
  outcomes:
  - 3
  - 4
- id: 16-03
  name: Configuration management system
  outcomes:
  - 3
- id: 13-08
  name: Baseline
  outcomes:
  - 5
  - 7
- id: 14-01
  name: Change history
  outcomes:
  - 4
- id: 15-56
  name: Configuration status summary
  outcomes:
  - 6
- id: 13-51
  name: Consistency Evidence
  outcomes:
