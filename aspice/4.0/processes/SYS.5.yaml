# Automotive SPICE 4.0 - built from the DRAFT 3.991 (yellow-band release of 2023-06-06), which says it is
# not for assessments. Identifiers and official names only; purpose, outcomes, intents and evidence
# are paraphrases. `maps_to` names the 3.1 base practices whose evidence structures in
# schema/items.yaml carry this practice; an empty list means the toolkit holds nothing for it.

id: SYS.5
name: System Verification
group: SYS
scope: vda
purpose: Make sure the system has been verified against its system requirements.
outcomes:
- n: 1
  text: Verification measures for the system are defined from the system requirements.
- n: 2
  text: Verification measures are chosen for the release scope, with regression in mind.
- n: 3
  text: The integrated system is verified with the chosen measures and the results recorded.
- n: 4
  text: Verification measures and system requirements are consistent and linked in both directions.
- n: 5
  text: Results and the measures they belong to are linked in both directions.
- n: 6
  text: Verification results are summarised and shared with all concerned.
base_practices:
- id: SYS.5.BP1
  name: Specify verification measures for system verification
  intent: Define measures that show compliance with functional and non-functional requirements, including techniques,
    criteria, sequence and environment.
  outcomes:
  - 1
  evidence:
  - System verification measures with criteria
  rule_ids: []
  maps_to:
  - SYS.5.BP1
  - SYS.5.BP2
- id: SYS.5.BP2
  name: Select verification measures
  intent: Record the choice of measures with regression criteria and sufficient coverage of the release scope.
  outcomes:
  - 2
  evidence:
  - Selection of verification measures
  rule_ids: []
  maps_to:
  - SYS.5.BP3
- id: SYS.5.BP3
  name: Perform verification of the integrated system
  intent: Run the chosen measures on the integrated system and record outcomes with pass/fail data.
  outcomes:
  - 3
  evidence:
  - Verification results
  rule_ids: []
  maps_to:
  - SYS.5.BP4
- id: SYS.5.BP4
  name: Ensure consistency and establish bidirectional traceability
  intent: Link measures to requirements and results to measures, and keep them consistent.
  outcomes:
  - 4
  - 5
  evidence:
  - Traceability and consistency results
  rule_ids: []
  maps_to:
  - SYS.5.BP5
  - SYS.5.BP6
- id: SYS.5.BP5
  name: Summarize and communicate results
  intent: Condense the verification results into a summary and pass it on.
  outcomes:
  - 6
  evidence:
  - Summary of verification results
  rule_ids: []
  maps_to:
  - SYS.5.BP7
output_work_products:
- id: 08-60
  name: Verification Measure
  outcomes:
  - 1
- id: 08-58
  name: Verification Measure Selection Set
  outcomes:
  - 2
- id: 15-52
  name: Verification Results
  outcomes:
  - 3
  - 5
- id: 13-51
  name: Consistency Evidence
  outcomes:
  - 4
- id: 13-52
  name: Communication Evidence
  outcomes:
  - 6
