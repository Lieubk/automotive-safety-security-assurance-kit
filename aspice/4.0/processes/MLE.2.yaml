# Automotive SPICE 4.0 - built from the DRAFT 3.991 (yellow-band release of 2023-06-06), which says it is
# not for assessments. Identifiers and official names only; purpose, outcomes, intents and evidence
# are paraphrases. `maps_to` names the 3.1 base practices whose evidence structures in
# schema/items.yaml carry this practice; an empty list means the toolkit holds nothing for it.

id: MLE.2
name: Machine Learning Architecture
group: MLE
scope: extended
purpose: Set up an ML architecture that supports training and deployment and agrees with the ML requirements, and
  evaluate it against set criteria.
outcomes:
- n: 1
  text: An ML architecture is developed.
- n: 2
  text: Ranges and starting values of hyperparameters are set as a basis for training.
- n: 3
  text: The ML architectural elements are evaluated.
- n: 4
  text: The ML architectural elements get defined interfaces.
- n: 5
  text: Targets for the resources the ML architectural elements may use are set.
- n: 6
  text: ML architectural elements and ML requirements are consistent and linked in both directions.
- n: 7
  text: The agreed ML architecture is made known to all concerned.
base_practices:
- id: MLE.2.BP1
  name: Develop ML architecture
  intent: Document the architectural elements, covering the model, its pre- and post-processing and the hyperparameters
    needed to create, train, test and deploy it.
  outcomes:
  - 1
  evidence:
  - ML architecture description
  rule_ids: []
  maps_to: []
- id: MLE.2.BP2
  name: Determine hyperparameter ranges and initial values
  intent: Fix and document the ranges and initial values of hyperparameters for training.
  outcomes:
  - 2
  evidence:
  - Hyperparameter ranges and initial values
  rule_ids: []
  maps_to: []
- id: MLE.2.BP3
  name: Evaluate ML architectural elements
  intent: Set evaluation criteria for the elements and assess the elements against them.
  outcomes:
  - 3
  evidence:
  - Evaluation of architectural elements
  rule_ids: []
  maps_to: []
- id: MLE.2.BP4
  name: Define interfaces of the ML architectural elements
  intent: Document internal and external interfaces of each element, including those to software components.
  outcomes:
  - 4
  evidence:
  - Interface descriptions of ML elements
  rule_ids: []
  maps_to: []
- id: MLE.2.BP5
  name: Define resource consumption objectives for the ML architectural elements
  intent: Set and document resource objectives for the elements in training and in deployment.
  outcomes:
  - 5
  evidence:
  - Resource consumption objectives
  rule_ids: []
  maps_to: []
- id: MLE.2.BP6
  name: Ensure consistency and establish bidirectional traceability
  intent: Keep the elements and the ML requirements consistent and linked both ways, at a reasonable level of abstraction.
  outcomes:
  - 6
  evidence:
  - Traceability and consistency results
  rule_ids: []
  maps_to: []
- id: MLE.2.BP7
  name: Communicate agreed ML architecture
  intent: Inform all affected parties of the agreed architecture, including the model details and initial hyperparameters.
  outcomes:
  - 7
  evidence:
  - Communication records
  rule_ids: []
  maps_to: []
output_work_products:
- id: 04-51
  name: ML architecture
  outcomes:
  - 1
  - 3
  - 4
  - 5
- id: 13-52
  name: Communication evidence
  outcomes:
