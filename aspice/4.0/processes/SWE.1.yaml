# Automotive SPICE 4.0 - built from the DRAFT 3.991 (yellow-band release of 2023-06-06), which says it is
# not for assessments. Identifiers and official names only; purpose, outcomes, intents and evidence
# are paraphrases. `maps_to` names the 3.1 base practices whose evidence structures in
# schema/items.yaml carry this practice; an empty list means the toolkit holds nothing for it.

id: SWE.1
name: Software Requirements Analysis
group: SWE
scope: vda
purpose: Establish a structured, analysed set of software requirements that agrees with the system requirements
  and system architecture.
outcomes:
- n: 1
  text: Software requirements are written down.
- n: 2
  text: Software requirements are grouped and given priorities.
- n: 3
  text: Software requirements are checked for being correct and technically achievable.
- n: 4
  text: What software requirements imply for the surrounding operating environment is examined.
- n: 5
  text: Software requirements and system requirements are consistent and linked in both directions.
- n: 6
  text: Software requirements and system architecture are consistent and linked in both directions.
- n: 7
  text: The agreed software requirements are made known to all concerned.
base_practices:
- id: SWE.1.BP1
  name: Specify software requirements
  intent: Use system requirements and architecture to derive functional and non-functional software requirements,
    written with the agreed qualities of a good requirement.
  outcomes:
  - 1
  evidence:
  - Software requirements specification
  rule_ids: []
  maps_to:
  - SWE.1.BP1
  - SWE.1.BP5
- id: SWE.1.BP2
  name: Structure software requirements
  intent: Arrange the requirements, for instance by function or variant, and rank them by need.
  outcomes:
  - 2
  evidence:
  - Requirements with structure and priority attributes
  rule_ids: []
  maps_to:
  - SWE.1.BP2
- id: SWE.1.BP3
  name: Analyze software requirements
  intent: Examine requirements and their dependencies for correctness and feasibility, and give project management
    input for estimates.
  outcomes:
  - 3
  evidence:
  - Analysis results on correctness and feasibility
  rule_ids: []
  maps_to:
  - SWE.1.BP3
- id: SWE.1.BP4
  name: Analyze the impact on the operating environment
  intent: Examine what the requirements mean for the elements of the operating environment.
  outcomes:
  - 4
  evidence:
  - Impact analysis on the operating environment
  rule_ids: []
  maps_to:
  - SWE.1.BP4
- id: SWE.1.BP5
  name: Ensure consistency and establish bidirectional traceability
  intent: Keep software requirements consistent with, and linked both ways to, system requirements and system architecture.
  outcomes:
  - 5
  - 6
  evidence:
  - Traceability records
  - Consistency check result
  rule_ids: []
  maps_to:
  - SWE.1.BP6
  - SWE.1.BP7
- id: SWE.1.BP6
  name: Communicate agreed software requirements and impact on the operating environment
  intent: Pass the agreed requirements and the impact findings to everyone concerned.
  outcomes:
  - 7
  evidence:
  - Communication records to affected parties
  rule_ids: []
  maps_to:
  - SWE.1.BP8
output_work_products:
- id: 17-00
  name: Requirement
  outcomes:
  - 1
- id: 17-54
  name: Requirement Attribute
  outcomes:
  - 2
- id: 15-51
  name: Analysis Results
  outcomes:
  - 3
  - 4
- id: 13-51
  name: Consistency Evidence
  outcomes:
  - 5
  - 6
- id: 13-52
  name: Communication Evidence
  outcomes:
  - 7
